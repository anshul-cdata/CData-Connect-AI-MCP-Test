name: Update push changelog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changelog:
    # Skip the bot's own commit so this does not loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append entry to CHANGELOG.md
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash .github/scripts/update-changelog.sh
      - name: Commit changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG for ${AFTER:0:7} [skip ci]"
          git push
