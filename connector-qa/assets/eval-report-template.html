<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231d5fbf%22/%3E%3Cpath d=%22M9 17l4.5 4.5L23 11%22 stroke=%22white%22 stroke-width=%223.2%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* connector-qa model eval report. Built by scripts/eval.mjs from stored runs — never edit by hand. */
/* ── design tokens ─────────────────────────────────────────────────────────── */
:root{
  --bg:#f3f5f8;--surface:#fff;--surface-2:#f8fafc;--ink:#0f1b2d;--ink-2:#334155;--muted:#5b6778;--line:#e2e7ee;--line-strong:#cdd5e0;--soft:#eef2f6;
  --accent:#1d5fbf;--accent-soft:#e7effb;--ok:#1d7a4c;--ok-soft:#e3f3ea;--warn:#9a5a06;--warn-soft:#fcefd9;--bad:#b42318;--bad-soft:#fdeceb;
  --na:#687384;--na-soft:#eef1f5;--blue:#1d5fbf;--blue-soft:#e7effb;
  --hero-1:#0b1d36;--hero-2:#173a68;--hero-muted:#b6c4d8;
  --m0:#1d5fbf;--m1:#2f8a5b;--m2:#b0701f;--m3:#7454b8;--m4:#b0466c;--m5:#2a8a91;
  --vs-correct:#639922;--vs-correct-bg:#EAF3DE;--vs-correct-fg:#27500A;--vs-partly:#BA7517;--vs-partly-bg:#FAEEDA;--vs-partly-fg:#633806;
  --vs-incorrect:#E24B4A;--vs-incorrect-bg:#FCEBEB;--vs-incorrect-fg:#791F1F;--vs-unsupported:#7F77DD;--vs-unsupported-bg:#EEEDFE;--vs-unsupported-fg:#3C3489;
  --vs-refused:#D4537E;--vs-refused-bg:#FBEAF0;--vs-refused-fg:#72243E;--vs-account:#378ADD;--vs-account-bg:#E6F1FB;--vs-account-fg:#0C447C;
  --vs-data:#1D9E75;--vs-data-bg:#E1F5EE;--vs-data-fg:#085041;--vs-na:#B4B2A9;--vs-na-bg:#F1EFE8;--vs-na-fg:#444441;
  --shadow:0 1px 2px rgb(16 24 40 / .05),0 1px 3px rgb(16 24 40 / .05);--shadow-hover:0 4px 12px rgb(16 24 40 / .08);
  --radius:12px;
  --f-display:"Inter","Segoe UI",system-ui,sans-serif;--f-body:"Inter","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0c121a;--surface:#141c26;--surface-2:#18212d;--ink:#e7edf4;--ink-2:#c3cdd9;--muted:#93a1b2;--line:#253141;--line-strong:#324154;--soft:#1b2532;
  --accent:#7fb2f0;--accent-soft:#1a2c44;--ok:#5fc493;--ok-soft:#14301f;--warn:#e3a94f;--warn-soft:#36280f;--bad:#f08a80;--bad-soft:#3a1d1b;
  --na:#9aa5b2;--na-soft:#212b37;--blue:#7fb2f0;--blue-soft:#1a2c44;--hero-1:#08121f;--hero-2:#122a4b;
  --m0:#7fb2f0;--m1:#6fcf9b;--m2:#e0a865;--m3:#b39ae0;--m4:#e08aa6;--m5:#7fcbd0;
  --vs-correct:#97C459;--vs-correct-bg:#27500A;--vs-correct-fg:#C0DD97;--vs-partly:#EF9F27;--vs-partly-bg:#633806;--vs-partly-fg:#FAC775;
  --vs-incorrect:#F09595;--vs-incorrect-bg:#791F1F;--vs-incorrect-fg:#F7C1C1;--vs-unsupported:#AFA9EC;--vs-unsupported-bg:#3C3489;--vs-unsupported-fg:#CECBF6;
  --vs-refused:#ED93B1;--vs-refused-bg:#72243E;--vs-refused-fg:#F4C0D1;--vs-account:#85B7EB;--vs-account-bg:#0C447C;--vs-account-fg:#B5D4F4;
  --vs-data:#5DCAA5;--vs-data-bg:#085041;--vs-data-fg:#9FE1CB;--vs-na:#888780;--vs-na-bg:#444441;--vs-na-fg:#D3D1C7;
  --shadow:0 1px 2px rgb(0 0 0 / .3);--shadow-hover:0 4px 14px rgb(0 0 0 / .35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0c121a;--surface:#141c26;--surface-2:#18212d;--ink:#e7edf4;--ink-2:#c3cdd9;--muted:#93a1b2;--line:#253141;--line-strong:#324154;--soft:#1b2532;
  --accent:#7fb2f0;--accent-soft:#1a2c44;--ok:#5fc493;--ok-soft:#14301f;--warn:#e3a94f;--warn-soft:#36280f;--bad:#f08a80;--bad-soft:#3a1d1b;
  --na:#9aa5b2;--na-soft:#212b37;--blue:#7fb2f0;--blue-soft:#1a2c44;--hero-1:#08121f;--hero-2:#122a4b;
  --m0:#7fb2f0;--m1:#6fcf9b;--m2:#e0a865;--m3:#b39ae0;--m4:#e08aa6;--m5:#7fcbd0;
  --vs-correct:#97C459;--vs-correct-bg:#27500A;--vs-correct-fg:#C0DD97;--vs-partly:#EF9F27;--vs-partly-bg:#633806;--vs-partly-fg:#FAC775;
  --vs-incorrect:#F09595;--vs-incorrect-bg:#791F1F;--vs-incorrect-fg:#F7C1C1;--vs-unsupported:#AFA9EC;--vs-unsupported-bg:#3C3489;--vs-unsupported-fg:#CECBF6;
  --vs-refused:#ED93B1;--vs-refused-bg:#72243E;--vs-refused-fg:#F4C0D1;--vs-account:#85B7EB;--vs-account-bg:#0C447C;--vs-account-fg:#B5D4F4;
  --vs-data:#5DCAA5;--vs-data-bg:#085041;--vs-data-fg:#9FE1CB;--vs-na:#888780;--vs-na-bg:#444441;--vs-na-fg:#D3D1C7;
  --shadow:0 1px 2px rgb(0 0 0 / .3);--shadow-hover:0 4px 14px rgb(0 0 0 / .35)}

/* ── base ──────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;margin:0;overflow-x:clip;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.wrap{max-width:1320px;margin:0 auto;padding-inline:24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:30px;font-weight:700;line-height:1.2}h2{font-size:20px;font-weight:650}h3{font-size:15.5px;font-weight:600}
p{margin:0;max-width:78ch}.muted{color:var(--muted)}.mono{font-family:var(--f-mono);font-size:12.5px}.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.tab,section{display:flex;flex-direction:column;gap:16px}.tab{gap:28px;scroll-margin-top:60px}.sec-head{display:flex;flex-direction:column;gap:6px}
.sec-head p{font-size:14px}

/* ── header band ───────────────────────────────────────────────────────────── */
.hero{background:radial-gradient(1200px 400px at 85% -20%,rgb(79 142 247 / .28),transparent 60%),linear-gradient(135deg,var(--hero-1),var(--hero-2));color:#fff}
.hero .wrap{padding-block:12px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;color:var(--hero-muted);margin-bottom:2px}
.brand .logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#4f8ef7,#22b8a0);display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:-.04em}
.brand .kind{margin-left:auto;padding:3px 10px;border:1px solid rgb(255 255 255 / .22);border-radius:999px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#dbe5f2}
.hero h1{color:#fff;font-size:22px;line-height:1.25}
.hero .lede{color:var(--hero-muted);font-size:13.5px;line-height:1.5;max-width:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.meta>span{display:inline-flex;gap:6px;align-items:baseline;background:rgb(255 255 255 / .07);border:1px solid rgb(255 255 255 / .14);border-radius:7px;padding:3px 9px;font-size:12px;color:var(--hero-muted)}
.meta b{color:#fff;font-weight:600}.meta .mono{font-size:12px}
.meta>span.warnchip{background:rgb(245 166 35 / .16);border-color:rgb(245 166 35 / .45);color:#ffd99a}.meta>span.warnchip b{color:#ffd99a}

/* ── sticky tab bar ────────────────────────────────────────────────────────── */
.tabbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgb(16 24 40 / .04)}
.tabs{display:flex;flex-wrap:nowrap;gap:0;overflow-x:auto;scrollbar-width:thin}
.tabs button{font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:13px 9px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:color .12s,border-color .12s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .c{font-size:11px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 7px;line-height:1.5}
.tabs button[aria-selected="true"] .c{background:var(--accent-soft);color:var(--accent)}
button:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.page{padding-block:28px 48px;display:flex;flex-direction:column;gap:28px}

/* ── surfaces ──────────────────────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.panel.note{border-left:4px solid var(--warn);background:var(--warn-soft)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--soft);gap:2px}.bar i{display:block;height:100%}
.bar .y{background:var(--ok)}.bar .b{background:var(--blue)}.bar .p{background:var(--warn)}.bar .n{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}.dot.y{background:var(--ok)}.dot.p{background:var(--warn)}.dot.n{background:var(--bad)}.dot.b{background:var(--blue)}
/* status colours, shared with the capability report: by who the result is about — the AI (traffic
   lights), the CData connector (purple, pink), the test account (blue, teal), nobody (grey). */
.bar .v-correct,.dot.v-correct{background:var(--vs-correct)}.bar .v-partly,.dot.v-partly{background:var(--vs-partly)}.bar .v-incorrect,.dot.v-incorrect{background:var(--vs-incorrect)}
.bar .v-unsupported,.dot.v-unsupported{background:var(--vs-unsupported)}.bar .v-blocked_connector,.dot.v-blocked_connector{background:var(--vs-refused)}
.bar .v-blocked_account,.dot.v-blocked_account{background:var(--vs-account)}.bar .v-blocked_data,.dot.v-blocked_data{background:var(--vs-data)}
.bar .v-not_applicable,.dot.v-not_applicable{background:var(--vs-na)}.bar .v-not_measured,.dot.v-not_measured{background:transparent;box-shadow:inset 0 0 0 1.5px var(--vs-na)}
.pill.v-correct{background:var(--vs-correct-bg);color:var(--vs-correct-fg)}.pill.v-partly{background:var(--vs-partly-bg);color:var(--vs-partly-fg)}.pill.v-incorrect{background:var(--vs-incorrect-bg);color:var(--vs-incorrect-fg)}
.pill.v-unsupported{background:var(--vs-unsupported-bg);color:var(--vs-unsupported-fg)}.pill.v-blocked_connector{background:var(--vs-refused-bg);color:var(--vs-refused-fg)}
.pill.v-blocked_account{background:var(--vs-account-bg);color:var(--vs-account-fg)}.pill.v-blocked_data{background:var(--vs-data-bg);color:var(--vs-data-fg)}
.pill.v-not_applicable{background:var(--vs-na-bg);color:var(--vs-na-fg)}.pill.v-not_measured{background:transparent;color:var(--vs-na-fg);box-shadow:inset 0 0 0 1px var(--vs-na);border:0;outline:1px dashed var(--vs-na);outline-offset:-1px}
.legend .grp{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}.legend .gl{font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-right:2px}

/* ── tables ────────────────────────────────────────────────────────────────── */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom-color:var(--line-strong)}
tbody tr:hover td{background:var(--surface-2)}tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}th.r,td.r{text-align:right}
td .bar{min-width:90px}

/* ── badges ────────────────────────────────────────────────────────────────── */
.grade{display:inline-block;min-width:40px;text-align:center;font-size:12px;font-weight:650;padding:2px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 22%,transparent)}
.grade.blue{background:var(--blue-soft);color:var(--blue)}.grade.yellow{background:var(--warn-soft);color:var(--warn)}.grade.red{background:var(--bad-soft);color:var(--bad)}.grade.none{background:var(--na-soft);color:var(--na)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;line-height:1.55}
.pill.y{background:var(--ok-soft);color:var(--ok)}.pill.p{background:var(--warn-soft);color:var(--warn)}.pill.n{background:var(--bad-soft);color:var(--bad)}.pill.na{background:var(--na-soft);color:var(--na)}
.pill.who{background:var(--surface-2);color:var(--ink-2);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.pill.src{background:var(--accent-soft);color:var(--accent);font-weight:500;text-decoration:none}a.pill.src:hover{text-decoration:underline}
.pill.ev-customer,.pill.ev-community{background:var(--ok-soft);color:var(--ok)}.pill.ev-vendor{background:var(--accent-soft);color:var(--accent)}.pill.ev-docs,.pill.ev-inferred{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}.pill.ev-inferred{font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* ── controls ──────────────────────────────────────────────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters button,.filters select{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:6px 13px;cursor:pointer}
.filters button:hover,.filters select:hover{border-color:var(--accent)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.link{font:inherit;font-size:13.5px;font-weight:500;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:none;align-self:flex-start}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ── AI journey ────────────────────────────────────────────────────────────── */
.journey{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.jstep{display:grid;grid-template-columns:24px 1fr;gap:12px;position:relative;padding-bottom:14px;font-size:13.5px}.jstep:last-child{padding-bottom:0}
.jstep::before{content:"";position:absolute;left:11px;top:24px;bottom:2px;width:2px;background:var(--line)}.jstep:last-child::before{display:none}
.jmark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.jmark.ok{background:var(--ok)}.jmark.err{background:var(--bad)}.jmark.fix{background:var(--warn)}.jmark.info{background:var(--na)}
.jhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.jtool{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.jkind{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.jtime{font-size:12px;color:var(--muted);margin-left:auto}
.jwhy{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.jerr{font-size:12.5px;color:var(--bad);white-space:pre-wrap;overflow-wrap:anywhere}
.jres{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
pre{margin:6px 0 2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;overflow-x:auto;max-width:100%;font-family:var(--f-mono);font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}

/* ── misc ──────────────────────────────────────────────────────────────────── */
dl.kv{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:9px 18px;margin:0;font-size:13.5px}dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
.empty{color:var(--muted);font-style:italic}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}

/* metric tooltips: one floating box, positioned in JS so table scroll containers never clip it */
.tip{text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px;cursor:help;border-radius:3px}
.tip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill.tip{text-decoration:none}
#tipbox{position:fixed;z-index:50;max-width:320px;background:#0f1b2d;color:#fff;font-size:12.5px;font-weight:400;line-height:1.5;letter-spacing:0;text-transform:none;padding:9px 12px;border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .22);pointer-events:none;opacity:0;transition:opacity .1s}
#tipbox.on{opacity:1}

@media (max-width:640px){.wrap{padding-inline:16px}.tabs{scrollbar-width:none}.hero h1{font-size:19px}.brand .kind{display:none}dl.kv{grid-template-columns:1fr}.panel{padding:16px}}
/* printing or saving as PDF: the open tab, without the controls */
@media print{body{background:#fff;font-size:12px}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.tabbar{position:static;box-shadow:none}
  .tabs button:not([aria-selected="true"]){display:none}.panel,.tbl,.stat,.mcard,.uc,.finding,.persona{box-shadow:none;break-inside:avoid}.filters,#tipbox,.link{display:none}}

/* ── eval: answers, model cards, comparison ────────────────────────────────── */
.podium,.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mtag{display:inline-flex;align-items:center;gap:7px;font-weight:600}.mtag i{width:10px;height:10px;border-radius:3px;display:inline-block}
.delta{font-size:12.5px;font-weight:650}.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.same{color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
#cmp{scroll-margin-top:64px}
/* Grid and flex items default to min-width:auto and grow to fit their longest unbreakable line, so a long
   SQL statement, JSON input or error URL in one journey column spills into the next. Let every column
   shrink to its track and wrap its content instead. */
.cmp>*,.panel,.jstep>div,.podium>*,.findings>*{min-width:0}
.verdict{border-left:4px solid var(--accent)}.verdict h2{font-size:21px;line-height:1.35}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow)}
.qcard .q{font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.qcard .a{font-size:16px;font-weight:650}
.qcard .d{font-size:13px;color:var(--ink-2)}.qcard .pill{align-self:flex-start;margin-top:2px}
.ulist{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.why{margin:6px 0;padding-left:18px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
tr.faint td{opacity:.55}details>summary{cursor:pointer;list-style:none;display:inline-block;margin-top:2px}details>summary::-webkit-details-marker{display:none}
.qa>*{min-width:0}
.takeaway{border-left:3px solid var(--accent);background:var(--blue-soft);padding:10px 14px;font-size:14px;color:var(--ink);border-radius:0 8px 8px 0}
.takeaway span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.coverage{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}

/* Plain-language meaning of every metric, shown on hover or keyboard focus. Edit the text here. */
const HELP = {
 "evidence": "How strong the proof is that real people want this: customer queries, then real users in the vendor's community, then the vendor's own guidance, then documentation. Inferred use cases (no direct evidence) are shown as such, never as equal.",
 "score": "A summary, not the ranking. Each use case gets 0–100: the answer is worth 50 (right 50, partly 25, wrong 0); efficiency 20, robustness 15 and speed and cost 15 are earned only in proportion to the answer, so a wrong answer scores 0. Efficiency and speed are measured against the other models compared, so this number is relative; the share of right answers is not.",
 "grades": "The small number under a result is its score. Blue = right and smooth (85 or more). Yellow = right with friction, or partly right. Red = wrong.",
 "correct": "Correct answers out of the use cases this model was actually asked. Use cases that need something the connector does not offer are left out: they measure the connector, not the model. A feature the test account's plan blocks, reported honestly, counts for no one. Models asked a different number of use cases are not on exactly the same base; the paired comparison uses only the use cases both were asked.",
 "first": "Correct first time: the answer was correct and no call failed on the way. A smooth journey that ends in an incorrect answer does not count.",
 "cost": "Dollars of AI tokens per 100 correct answers. Shows — until a price per model is set in config.json under \"pricing\".",
 "calls": "Average calls to the connector per use case: looking around (catalogs, tables, columns) plus queries and changes. Fewer is better only when the answer is right.",
 "time": "Average time from the AI's first call to its final answer.",

 "tpc": "All the tokens a model spent, divided by its correct answers. A cheap model that is usually incorrect is expensive per correct answer.",

(function tipbox(){

/* ── results: the capability report's verdicts and colours ───────────────── */
const VL = {correct:'Correct',partly:'Partly correct',incorrect:'Incorrect',unsupported:'Not supported',blocked_connector:'Refused by the connector',blocked_account:'Blocked by the account',blocked_data:'Blocked by test data',not_applicable:'Not applicable',not_measured:'Not measured'};

function header(){ return `<header class="hero"><div class="wrap"><div class="brand"><span class="logo" aria-hidden="true">QA</span><span>CData Connect AI · Connector QA</span><span class="kind">Model evaluation</span></div><h1>Which AI model works best with the ${esc(D.connector)} ConnectAI MCP?</h1>

const TABS=[['sum','Overview'],['board','Models side by side'],['kind','Strengths by kind of work'],['grid','Use cases'],['diff','Where models differ'],['gaps','Where it goes wrong'],['method','How this was measured']];

const CONF = {clear:['y','Clear'],close:['p','Too close to call'],indicative:['p','Small sample'],'n/a':['na','Not enough data']};

/* answers the report words itself, from the numbers, instead of the stored sentence */

const QSHORT = {complex:'which model handles complex tasks best', write:'which model is best at changing data', ambiguity:'which model handles unclear requests best', dates:'which model handles relative dates best'};
const thinText = q => `${QSHORT[keyOf(q)]||esc(String(q.q).replace(/\?$/,'').toLowerCase())} (${q.n?`only ${plural(q.n,'use case')}`:'no use case tests it'})`;

const GF = [['all','All'],['high','Models disagree'],['unique_win','Only one correct'],['unique_failure','Only one incorrect'],['all_failed','All incorrect'],['connector_blocked','Not supported'],['not_applicable','Not applicable']];

  return `<div class="sec-head"><h2>Every use case, every model</h2><p class="muted">Same request, same connector. Each cell is the result; the small number under it is its ${T('score','grades')}. "Recovered" means correct after at least one failed call.</p></div>
  <div class="filters" role="group" aria-label="Filter by how the models compare">${GF.map(([k,l])=>`<button type="button" data-g="${k}" aria-pressed="${gf===k}">${l}</button>`).join('')}</div>
  <div class="filters" role="group" aria-label="Filter by attribute">
    ${sel('gq-model','Model',D.models.map(m=>[m,NM(m)]),gq.model)}${sel('gq-out','result',[['correct','Correct first time'],['recovered','Correct after recovering'],['partial','Partly correct'],['wrong','Incorrect'],['not_possible','Said it could not be done']],gq.out)}
    ${sel('gq-diff','Difficulty',['simple','medium','complex'].map(d=>[d,d]),gq.diff)}${sel('gq-area','Area',uniq('area').map(a=>[a,a]),gq.area)}
    ${sel('gq-persona','Who asks',uniq('persona').map(a=>[a,a]),gq.persona)}${sel('gq-skill','Skill',skills.map(k=>[k,k.replace(/_/g,' ')]),gq.skill)}

    <span class="muted num" style="font-size:13px">${shown.length} of ${rows.length} shown</span></div>

  ${shown.map(c=>`<tr><td>"${esc(c.request)}"<br><span class="mono muted">${esc(c.id)}</span> · <button type="button" class="link" data-cmp="${esc(c.id)}">Compare the models →</button><br>${EVP(c)}</td><td>${esc(c.area||'')}<br><span class="muted">${esc(c.persona||'')}</span></td><td>${esc(c.difficulty||'—')}<br><span class="muted">${esc(PAT[c.pattern]||c.pattern||'')}</span></td>
    ${D.models.map(m=>{const x=c.cells[m];return `<td class="c">${RES(x)}${recovered(x)?'<br><span class="recov">recovered</span>':''}${x&&x.score!=null&&['correct','partly','incorrect'].includes(vOf(x))?`<br><span class="muted" style="font-size:12px">${x.score}</span>`:''}</td>`;}).join('')}<td class="muted">${esc(NMS(A.agreement_labels?.[c.agreement]||c.agreement))}${c.who?`: <b>${esc(NM(c.who))}</b>`:''}${c.discrimination?`<br><span style="font-size:12px">${T(`Tells them apart: ${DISCW[c.discrimination]||c.discrimination}`,'disc')}</span>`:''}</td></tr>`).join('')||`<tr><td colspan="${D.models.length+4}" class="empty">No use case matches.</td></tr>`}</tbody></table></div>

/* ── compare the models on one use case: reads like the capability report's use case page ── */
const RULE_TEXT = {
  same_ids:'the answer must name exactly the records our check found',
  contains:'every record our check found must be in the answer',
  same_count:'the answer must give the same number our check found',
  values_within:'the numbers in the answer must match our check, record by record',
  write_visible:'the change must show in the data afterwards, and nothing else may change',
  judge:'no query can decide this one, so a fixed AI judge read the answer'};
/* a check's detail, in words: field names and codes out, "the agent" and "the reference" in plain terms */
const words = s => { s = String(s ?? '').replace(/\s*\(\s*"[^"]*"\s*\)/g,'').replace(/"(\w+)"/g,'$1').replace(/\bthe agent's\b/gi,"the AI's").replace(/\bthe agent\b/gi,'the AI').replace(/\b(t|T)he reference( query)?\b/g,(x,t)=>t==='T'?'Our check':'our check').replace(/\b(r|R)eference\b/g,(x,r)=>r==='R'?'Our check':'our check').replace(/\bdiscovery calls\b/g,'calls to look around').replace(/\bexpected_behaviou?r\b/g,'expected behaviour').replace(/\s+/g,' ').trim(); return cap1(s); };
function plainCheck(d){
  if (!d) return '';
  let s = String(d), tail = '', judge = null, m, out;
  const j = s.match(/\s*(?:·\s*)?(?:re-check )?judge:\s*([\s\S]*)$/i);
  if (j) { judge = j[1].trim(); s = s.slice(0, j.index).trim(); }
  const tg = s.match(/\s*\((from the agent's own report|the agent's rows, confirmed by re-running its query)\)\s*$/);
  if (tg) { s = s.slice(0, tg.index); tail = /confirmed/.test(tg[1]) ? " We re-ran the AI's own query: its records are real." : ' Taken from the records the AI reported.'; }
  if ((m = s.match(/^(\d+) shared · answer (\d+) · reference (\d+)/))) out = `The answer named ${plural(m[2],'record')}; our check found ${m[3]}; ${m[1]} ${m[1]==='1'?'is':'are'} in both.`;
  else if ((m = s.match(/^same (\d+) records/))) out = `The answer named exactly the ${plural(m[1],'record')} our check found.`;
  else if ((m = s.match(/^all (\d+) expected records present/))) out = `All ${plural(m[1],'record')} our check found are in the answer.`;
  else if ((m = s.match(/^(\d+) of (\d+) expected records present/))) out = m[1]==='0' ? `None of the ${plural(m[2],'record')} our check found ${m[2]==='1'?'is':'are'} in the answer.` : `${m[1]} of the ${plural(m[2],'record')} our check found ${m[1]==='1'?'is':'are'} in the answer.`;
  else if ((m = s.match(/^(\d+) of (\d+) matched · (\d+) with \S+ out of tolerance/))) out = `${m[1]} of the ${plural(m[2],'record')} our check found ${m[1]==='1'?'is':'are'} in the answer${m[3]!=='0'?`; ${m[3]} with a different number`:', with the right numbers'}.`;
  else if ((m = s.match(/^(\d+) records, \S+ within/))) out = `All ${plural(m[1],'record')} and their numbers match our check.`;
  else if ((m = s.match(/^agent (\d+), reference (\d+)/))) out = `The answer gave ${m[1]}; our check counted ${m[2]}.`;
  else if ((m = s.match(/^(\d+) of (\d+)$/))) out = `The answer gave the same number as our check (${m[2]}).`;
  else if ((m = s.match(/^sample of (\d+) all correct, stated total (\d+)/))) out = `The answer showed ${m[1]} records, all right, and the right total (${m[2]}).`;
  else if ((m = s.match(/^sample of (\d+): (\d+) not in the reference · stated total (\S+) vs (\d+)/))) out = `The answer showed ${m[1]} records (${m[2]} not found by our check) and a total of ${m[3]==='none'?'nothing':m[3]}; our check found ${m[4]}.`;
  else if (/not keyed like the reference|lines up with the reference|shaped differently|decided by the answer judge/.test(s)) out = 'Our check could not line the answer up with its own records, so a fixed AI judge decided.';
  else out = words(s) + (/[.!?]$/.test(s.trim()) ? '' : '.');
  return out + tail + (judge ? ` The judge said: "${words(judge)}"` : '');
}
function checkWords(x, vd){
  const c = x.check || {}, d = c.detail || x.reason || '';
  if (x.probe && (vd==='unsupported'||vd==='not_applicable')) return `It needs something the connector does not offer, so it counts for no model. The AI was asked anyway, to see whether it says so: ${x.probe.outcome==='correct'?'it said plainly that it cannot be done.':x.probe.outcome==='wrong'?'<b>it invented an answer.</b>':x.probe.outcome==='partial'?'it was partly honest.':'awaiting the judge.'}`;
  if (vd==='unsupported') return 'Not asked to complete it: it needs something the connector does not offer, so it counts for no model.';
  if (vd==='not_applicable') return "Not asked: it needs something that exists only in the source's own app.";
  if (vd==='blocked_account') return `${esc(D.connector)} refused this for the test account's plan or rights, and the AI said so. It counts for no model.`;
  if (vd==='blocked_connector') return 'The connector refused the operation, and the AI said so. A connector finding, not an AI mistake.';
  if (vd==='blocked_data') return 'The test account held nothing to check the answer against, so this run measured nothing.';
  if (vd==='not_measured') return `Not measured: ${esc(words(d)||'no result recorded')}.`;
  const rule = RULE_TEXT[c.rule];
  return `${rule?`The rule: ${rule}. `:''}${esc(plainCheck(d))}${x.second_judge?` ${x.second_judge.agree?'A second AI judge agreed.':`A second AI judge disagreed (it said ${esc(RL[x.second_judge.outcome]||x.second_judge.outcome)}): worth a look.`}`:''}`;
}
function stepHtml(s){
  const mark = s.ok ? (s.recovery_of ? 'fix' : (s.category==='discovery'?'info':'ok')) : 'err';
  const kind = s.recovery_of ? `recovery of ${s.recovery_of}` : s.retry_of ? `${s.category} · retry of ${s.retry_of}` : s.category;
  return `<li class="jstep"><span class="jmark ${mark}">${s.n}</span><div><div class="jhead"><span class="jtool">${esc(s.tool)}</span><span class="jkind">${esc(kind)}</span>${s.ms!=null?`<span class="jtime num">${(s.ms/1000).toFixed(1)} s</span>`:''}</div>
    ${s.reason?`<div class="jwhy">Reason given: "${esc(s.reason)}"</div>`:''}${s.input?`<pre>${esc(s.input)}</pre>`:''}
    ${s.ok?(s.result?`<div class="jres">Result${s.rows!=null?` · ${s.rows} rows`:''}: ${esc(String(s.result).slice(0,1200))}</div>`:''):`<div class="jerr">Error · ${esc(s.error_class)} · cause: ${esc(CAUSE[s.cause]||s.cause)} · ${esc(s.error)}</div>`}</div></li>`;
}
function modelCard(m, x, row){
  if(!x) return `<div class="panel"><h3>${TAG(m)}</h3><p class="empty">Not run for this model.</p></div>`;
  const c = row.cells[m], vd = x.verdict || vOf(c), mt = x.metrics || {}, rp = D.reports?.[m];
  const why = (row.behaviour?.[m]||[]).filter(b=>!/^check:/.test(b));
  return `<div class="panel"><div class="ctop">${TAG(m)}${['correct','partly','incorrect'].includes(vd)?G(x.score,x.grade):''}</div>
    <div>${VP(vd)}${recovered(c)?' <span class="recov">recovered</span>':''}</div>
    ${x.clarify?`<p class="small">It first asked: "${esc(x.clarify.answer)}"<br>The user replied: "${esc(x.clarify.reply)}"</p>`:''}
    <div class="told"><span>What it told the user</span>${x.answer?`"${esc(x.answer)}"`:'<span class="empty">No answer recorded.</span>'}</div>
    <div><span class="eyebrow">How it was checked</span><p class="chk">${checkWords(x, vd)}</p></div>
    ${why.length?`<div><span class="eyebrow">On the way</span><ul class="why">${why.map(b=>`<li>${esc(words(NMS(b)))}</li>`).join('')}</ul></div>`:''}
    <p class="muted num small">${plural(mt.calls??0,'call')} to the connector${mt.failed?`, ${mt.failed} failed`:''} · ${mt.time_ms?(mt.time_ms/1000).toFixed(0)+' s':'—'} · ${mt.tokens?(mt.tokens/1000).toFixed(0)+'k tokens':'— tokens'}</p>
    ${x.steps.length?`<details><summary class="link">Every call the AI made · ${x.steps.length}</summary><p class="muted small" style="margin:6px 0">All of these were made by the AI itself, in order. Our check is not among them.</p><ol class="journey">${x.steps.map(stepHtml).join('')}</ol></details>`:'<p class="empty">No calls recorded.</p>'}
    ${rp?`<a class="link" href="${esc(rp.file)}">Full detail in the ${esc(NM(m))} report ↗</a>`:''}</div>`;
}
function compare(id){
  const J = D.journeys?.[id] || {}, row = (A.cases||[]).find(r=>r.id===id), g = (D.grid||[]).find(r=>r.id===id) || {};
  const back = `<button type="button" class="link" data-back="1">← ${cmpFrom==='diff'?'Where models differ':cmpFrom==='gaps'?'Where it goes wrong':'All use cases'}</button>`;
  if(!row) return back + '<p class="empty">This use case is not in the comparison.</p>';
  return `${back}
  <div class="sec-head" id="cmp"><span class="eyebrow">Use case <span class="mono">${esc(id)}</span>${row.area?' · '+esc(row.area):''}</span><h2>"${esc(row.request)}"</h2>
    <div class="tags">${row.persona?`<span class="pill who">${esc(row.persona)}</span>`:''}${row.difficulty?`<span class="pill who">${esc(row.difficulty)}</span>`:''}${row.pattern?`<span class="pill who">${esc(PAT[row.pattern]||row.pattern)}</span>`:''}<span class="pill who">${esc(NMS(A.agreement_labels?.[row.agreement]||row.agreement||''))}${row.who?`: ${esc(NM(row.who))}`:''}</span></div></div>
  <div class="panel"><h3>What a good answer does</h3>${(g.expected||[]).length?`<ul class="ulist">${g.expected.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:'<p class="empty">No expected behaviour recorded.</p>'}</div>
  <div class="cmp">${D.models.map(m=>modelCard(m, J[m], row)).join('')}</div>`;
}

/* ── where models differ ─────────────────────────────────────────────────── */
const AGV = {all_correct:'correct',all_correct_friction:'correct',unique_win:'partly',unique_failure:'partly',split:'partly',all_failed:'incorrect',connector_blocked:'unsupported',not_applicable:'not_applicable',not_measured:'not_measured'};
const AGORD = ['all_correct','all_correct_friction','unique_win','unique_failure','split','all_failed','connector_blocked','not_applicable','not_measured'];
function agreementPanel(){
  const ag = A.agreement || {}, tot = Object.values(ag).reduce((a,b)=>a+b,0)||1, ks = AGORD.filter(k=>ag[k]);
  return `<div class="panel"><div class="bar" style="height:14px" role="img" aria-label="${ks.map(k=>`${ag[k]} ${esc(A.agreement_labels?.[k]||k)}`).join(', ')}">${ks.map(k=>`<i class="v-${AGV[k]}" style="width:${pct(ag[k],tot)}"></i>`).join('')}</div>
  <div class="legend num">${ks.map(k=>`<span><span class="dot v-${AGV[k]}"></span><b>${ag[k]}</b>&nbsp;${esc(NMS(A.agreement_labels?.[k]||k))}</span>`).join('')}</div></div>`;
}
function uniquePanels(){
  const U = A.unique || {};
  return `<div class="podium">${D.models.map(m=>{const u=U[m]||{wins:[],failures:[]}, n=esc(NM(m));return `<div class="panel" style="border-top:4px solid ${MC(m)}"><h3>${TAG(m)}</h3>
    <p class="small">Only ${n} correct: <b>${u.wins.length}</b> · only ${n} incorrect: <b>${u.failures.length}</b></p>
    ${u.wins.length?`<details><summary class="link">The ${plural(u.wins.length,'use case')} only ${n} got correct</summary><ul class="ulist">${u.wins.slice(0,12).map(w=>`<li><button type="button" class="link mono" data-cmpg="${esc(w.id)}">${esc(w.id)}</button> "${esc(w.request)}"<br><span class="muted">${esc(words(NMS(w.behaviour)))}</span></li>`).join('')}${u.wins.length>12?`<li class="muted">… and ${u.wins.length-12} more (Use cases → Only one correct)</li>`:''}</ul></details>`:''}
    ${u.failures.length?`<details><summary class="link">The ${plural(u.failures.length,'use case')} only ${n} got incorrect</summary><ul class="ulist">${u.failures.slice(0,12).map(w=>`<li><button type="button" class="link mono" data-cmpg="${esc(w.id)}">${esc(w.id)}</button> "${esc(w.request)}"<br><span class="muted">${esc(VW(w.result))} · ${esc(words(NMS(w.behaviour)))}</span></li>`).join('')}${u.failures.length>12?`<li class="muted">… and ${u.failures.length-12} more (Use cases → Only one incorrect)</li>`:''}</ul></details>`:''}</div>`;}).join('')}</div>`;
}
let diffAll=false;
function diff(){
  const byId = new Map((A.cases||[]).map(c=>[c.id,c])), cs = (A.differ||[]).map(id=>byId.get(id)).filter(Boolean);
  const shown = diffAll ? cs : cs.slice(0, LIMIT);
  return `<div class="sec-head"><h2>Where models differ</h2><p class="muted">How the models' results line up on each use case, then the use cases that tell them apart, most telling first.</p></div>
  ${agreementPanel()}
  <div class="tbl"><table class="num"><thead><tr><th style="min-width:260px">Business request</th><th>Difficulty</th>${D.models.map(m=>`<th class="c">${TAG(m)}</th>`).join('')}<th style="min-width:240px">${T('Why they differ','spread')}</th></tr></thead><tbody>
  ${shown.map(c=>`<tr><td>"${esc(c.request)}"<br><span class="mono muted">${esc(c.id)}</span> · <button type="button" class="link" data-cmpg="${esc(c.id)}">Compare the models →</button></td><td>${esc(c.difficulty||'—')}</td>
    ${D.models.map(m=>`<td class="c">${RES(c.cells[m])}${recovered(c.cells[m])?'<br><span class="recov">recovered</span>':''}</td>`).join('')}
    <td class="muted" style="font-size:12.5px">${c.best?`Best: ${TAG(c.best)}`:''}${c.worst?` · weakest: ${TAG(c.worst)}<br>${esc(words(NMS((c.behaviour[c.worst]||[]).filter(b=>!/^check:/.test(b)).slice(0,2).join('; ')||'its answer did not pass the check')))}`:''}</td></tr>`).join('')||`<tr><td colspan="${D.models.length+3}" class="empty">The models never ended differently.</td></tr>`}</tbody></table></div>
  ${cs.length>LIMIT?`<button type="button" class="link" data-diffall="1">${diffAll?`Show the first ${LIMIT}`:`Show all ${cs.length}`}</button>`:''}
  <section><div class="sec-head"><h3>Unique wins and failures</h3><p class="muted small">What one model can do that the others cannot, and the reverse.</p></div>${uniquePanels()}</section>
  ${(A.check_suspects||[]).length?`<section><div class="sec-head"><h3>Check these before blaming the models</h3><p class="muted small">Every model got these incorrect. That is often the check, not the models: a yes-or-no question checked on record ids, or a check that covers less than the request asks. Confirm each check first.</p></div>
  <div class="tbl"><table><thead><tr><th style="min-width:240px">Business request</th><th>How it is checked</th>${D.models.map(m=>`<th>${TAG(m)}</th>`).join('')}</tr></thead><tbody>${A.check_suspects.map(c=>{const row=byId.get(c.id);return `<tr><td>"${esc(c.request)}"<br><span class="mono muted">${esc(c.id)}</span> · <button type="button" class="link" data-cmpg="${esc(c.id)}">Compare the models →</button></td><td class="small">${esc(cap1(RULE_TEXT[c.rule]||'compared with our check'))}</td>${c.details.map(d=>`<td class="small">${row?RES(row.cells[d.model]):esc(VW(d.result))}<br><span class="muted">${esc(clip(plainCheck(d.detail), 220))}</span></td>`).join('')}</tr>`;}).join('')}</tbody></table></div></section>`:''}`; }

/* ── where it goes wrong: whose problem, what repeats, what to fix ───────── */
let fixAll=false;
const OWN = [['model','--vs-incorrect'],['connector','--vs-unsupported'],['instructions','--vs-refused'],['metadata','--vs-refused'],['environment','--vs-account'],['unclear','--vs-na']];
function gaps(){
  const S = A.separation || {};
  const box = ([k, c]) => { const x = S[k]; if(!x || !x.items.length) return ''; return `<div class="panel" style="border-top:4px solid var(${c})"><h3>${esc(x.label)} <span class="pill who num">${x.items.length}</span></h3><p class="muted small">${esc(NMS(x.note))}</p>
    <details><summary class="link">Show the ${plural(x.items.length,'use case')}</summary><ul class="ulist">${x.items.map(i=>`<li><button type="button" class="link mono" data-cmpg="${esc(i.id)}">${esc(i.id)}</button> "${esc(i.request)}"<br><span class="muted">${esc(cap1(VW(i.detail)))}</span></li>`).join('')}</ul></details></div>`; };
  const none = OWN.filter(([k])=>S[k] && !S[k].items.length).map(([k])=>S[k].label.toLowerCase());
  return `<div class="sec-head"><h2>Where it goes wrong</h2><p class="muted">Whose problem each failure is, which problems repeat, and what to fix first. A failure every model shares counts against the connector only when each model's failure traces back to it.</p></div>
  <div class="two">${OWN.map(box).join('')}</div>
  ${none.length?`<p class="muted small">Nothing traced to: ${esc(none.join(', '))}.</p>`:''}
  <section><div class="sec-head"><h3>Problems that repeat</h3><p class="muted small">Per model: use cases where the problem came up · share that still ended right. The same rate on every model points at the connector; one model far worse points at that model.</p></div>
  ${D.friction.length?`<div class="tbl"><table class="num"><thead><tr><th>Problem</th><th>Who should fix it</th>${D.models.map(m=>`<th class="c">${TAG(m)}</th>`).join('')}</tr></thead><tbody>${D.friction.map(f=>`<tr><td>${esc(f.label)}</td><td><span class="pill who">${esc(f.cause||'')}</span></td>${D.models.map(m=>{const c=f.cells[m];return `<td class="c">${c.tests||'—'}${c.tests&&c.recovered!=null?` · <span class="delta ${c.recovered>=90?'up':c.recovered>=60?'same':'down'}">${c.recovered}%</span>`:''}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`:'<p class="empty">No failed calls.</p>'}</section>
  <section><div class="sec-head"><span class="eyebrow">For the dev team</span><h3>What to fix first</h3><p class="muted small">Connector, usage-instruction and metadata problems every model hits, ranked by how many tests they cost.</p></div>
  ${D.fix_list.length?`<div class="tbl"><table class="num"><thead><tr><th>#</th><th>Fix</th><th>Owner</th><th>Evidence</th></tr></thead><tbody>${D.fix_list.slice(0, fixAll?undefined:10).map(f=>`<tr><td>${f.rank}</td><td><b>${esc(f.fix)}</b></td><td><span class="pill who">${esc(f.owner)}</span></td><td>${esc(f.evidence)}</td></tr>`).join('')}</tbody></table></div>${D.fix_list.length>10?`<button type="button" class="link" data-fixall="1">${fixAll?'Show the top 10':`Show all ${D.fix_list.length}`}</button>`:''}`:'<p class="empty">Nothing that every model hits.</p>'}</section>`; }

/* ── how this was measured: method, exact statistics, limits, baseline ───── */
function base(){ const b = D.baseline; if(!b) return '';
  return `<section><div class="sec-head"><h3>Compared with the previous eval</h3><p class="muted small">Baseline <span class="mono">${esc(b.eval_id)}</span> (${esc(b.date)}). A change of 5 points or more counts.</p></div>
  <div class="tbl"><table class="num"><thead><tr><th>Model</th><th>Baseline</th><th>Now</th><th>Change</th><th>Improved</th><th>Same</th><th>Regressed</th></tr></thead><tbody>${b.rows.map(r=>{const d=(r.now??0)-(r.before??0);return `<tr><td>${TAG(r.model)}</td><td>${G(r.before)}</td><td>${G(r.now)}</td><td><span class="delta ${d>0?'up':d<0?'down':'same'}">${d>0?'+':''}${d}</span></td><td>${r.up}</td><td>${r.same}</td><td>${r.down}</td></tr>`;}).join('')}</tbody></table></div>
  ${b.regressions.length?`<h3>Regressions to look at</h3><div class="tbl"><table class="num"><thead><tr><th>Use case</th><th>Model</th><th>Before</th><th>Now</th></tr></thead><tbody>${b.regressions.map(r=>`<tr><td><span class="mono">${esc(r.id)}</span> "${esc(r.request)}"</td><td>${TAG(r.model)}</td><td>${G(r.before)}</td><td>${G(r.now)}</td></tr>`).join('')}</tbody></table></div>`:''}</section>`; }
function method(){
  const M = D.method, at = M.attempts || {}, dc = A.discrimination || {};
  const limits = [
    M.judge_conflict?.length ? `<b>The judge is also a contestant.</b> ${esc(M.judge_conflict.map(NM).join(', '))} judges answers and realism and is compared here, so it may favour itself. Use a judge outside the compared models, or judge twice and report disagreement.` : null,
    `<b>Attempts.</b> ${D.models.map(m=>`${esc(NM(m))}: ${at[m]?.several??0} use cases asked several times, ${at[m]?.one??0} once`).join(' · ')}. One attempt per use case makes close comparisons noisy.`,
    `<b>Score.</b> The share of right answers is absolute. The score's efficiency and speed parts are measured against the compared models, so adding a model can move another's score by a few points.`,
    `<b>How well use cases tell models apart</b> is measured after the run: ${dc.high||0} high, ${dc.medium||0} medium, ${dc.low||0} low. With ${D.models.length} models and mostly one attempt, treat it as a first reading.`,
    (A.agreement?.connector_blocked) ? `<b>Not supported.</b> ${A.agreement.connector_blocked} use cases need a capability CData ConnectAI MCP does not offer; no model was asked, and they are left out of every model's share of right answers.` : null,
    (A.agreement?.not_applicable) ? `<b>Not applicable.</b> ${plural(A.agreement.not_applicable,'use case')} exist only in ${esc(D.connector)}'s own app; no model was asked, and they are left out like the not-supported ones.` : null,
    (A.agreement?.not_measured) ? `<b>Not measured on every model:</b> ${A.agreement.not_measured} use cases (no test data, not run, or awaiting a check).` : null,
    M.harness_warn ? `<b>Test harness.</b> Some connector tools were not on the permission allow list; calls could be refused at random.` : null,
    (D.compared?.incomplete||[]).length ? `<b>Incomplete runs compared:</b> ${esc(NMS(D.compared.incomplete.join(' · ')))}` : null,
  ].filter(Boolean);
  return `<div class="sec-head"><h2>How this was measured</h2><p class="muted">What was run, what stayed fixed, the exact statistics behind "real difference" and "could be luck", and the limits of this eval.</p></div>
  <div class="podium"><div class="panel"><h3>What was run and what was reused</h3><dl class="kv">${M.runs.map(r=>`<dt>${esc(NM(r.model))}</dt><dd>${r.reused?`Reused stored run <span class="mono">${esc(r.run_id)}</span>`:`Run for this eval as <span class="mono">${esc(r.run_id)}</span>`}</dd>`).join('')}
  <dt>Comparable because</dt><dd>catalog v${esc(D.catalog_version)} · fingerprint <span class="mono">${esc(D.fingerprint?.key||'')}</span></dd></dl></div>
  <div class="panel"><h3>What stays fixed</h3><dl class="kv"><dt>Capability list</dt><dd>Script, from the source's API description</dd><dt>Use case catalog</dt><dd>Frozen v${esc(D.catalog_version)}${M.fixed?.research?` · researched with ${esc(NM(M.fixed.research))}`:''}</dd>
  <dt>Wording and realism</dt><dd>${esc(NM(M.fixed?.writer||M.fixed?.research_business||'—'))} writer · ${esc(NM(M.fixed?.judge||M.fixed?.realism_judge||'—'))} judge</dd><dt>Answer checks and scoring</dt><dd>Scripts${M.fixed?.answer_judge?`; ${esc(NM(M.fixed.answer_judge))} judges answers no query can decide`:''}</dd><dt>Agent used</dt><dd><b>Varies:</b> ${D.models.map(m=>esc(NM(m))).join(' · ')}</dd></dl></div></div>
  ${(A.pairs||[]).length?`<section><div class="sec-head"><h3>Is the gap real? The exact figures</h3><p class="muted small">A paired McNemar exact test on the use cases both models were asked. Only the use cases exactly one of them got correct decide it. Below p = 0.05 the report calls it a real difference; otherwise it could be luck. The interval is the 95% range of the difference in right answers.</p></div>
  <div class="tbl"><table class="num"><thead><tr><th>Pair</th><th class="r">Asked of both</th><th class="r">Only first right</th><th class="r">Only second right</th><th class="r">Difference</th><th class="r">95% interval</th><th class="r">p</th><th>Reading</th></tr></thead><tbody>
  ${A.pairs.map(p=>`<tr><td>${TAG(p.a)} vs ${TAG(p.b)}</td><td class="r">${p.n}</td><td class="r">${p.a_only}</td><td class="r">${p.b_only}</td><td class="r">${p.diff_pts>0?'+':''}${p.diff_pts} pts</td><td class="r">${p.ci[0]} to ${p.ci[1]}</td><td class="r">${p.p<0.001?'&lt; 0.001':p.p}</td><td class="small">${p.significant?`A real difference${p.lead?`: ${esc(NM(p.lead))} ahead`:''}`:'Could be luck'}</td></tr>`).join('')}</tbody></table></div></section>`:''}
  <section><h3>What the benchmark contains</h3>${contents(true)}</section>
  <div class="panel"><h3>Limits of this benchmark</h3><ul class="ulist">${limits.map(l=>`<li>${l}</li>`).join('')}</ul></div>
  ${base()}`; }

const R = {sum,board,kind,grid,diff,gaps,method};
let cur='sum';
function render(){ app.innerHTML = header()+tabs()+`<main class="wrap page"><div class="tab" role="tabpanel" id="p-${cur}" aria-labelledby="t-${cur}">${R[cur]()}</div><footer><span>connector-qa · eval <span class="mono">${esc(D.eval_id)}</span> · built from stored runs</span><span>${esc(D.connector)} · ${esc(D.date)}</span></footer></main>`; }
const toTop = () => { try { const el = document.getElementById('p-'+cur); if (el && el.scrollIntoView) el.scrollIntoView({block:'start'}); } catch(_){} };
app.addEventListener('click', e => { const t = e.target.closest('button'); if(!t) return;
  if(t.getAttribute('role')==='tab'){ cur=t.id.slice(2); cmpId=null; try{localStorage.setItem('eval-tab',cur)}catch(_){} render(); return; }
  if(t.dataset.go){ cur=t.dataset.go; cmpId=null; render(); toTop(); return; }
  if(t.dataset.g){ gf=t.dataset.g; gAll=false; render(); return; }
  if(t.dataset.dim){ dim=t.dataset.dim; render(); return; }
  if(t.dataset.fixall){ fixAll=!fixAll; render(); return; }
  if(t.dataset.diffall){ diffAll=!diffAll; render(); return; }
  if(t.dataset.gall){ gAll=!gAll; render(); return; }
  if(t.dataset.back){ cmpId=null; cur=cmpFrom; render(); toTop(); return; }
  if(t.dataset.cmpg || t.dataset.cmp){ cmpFrom = cur; cur='grid'; cmpId = t.dataset.cmpg || t.dataset.cmp; render(); toTop(); } });
app.addEventListener('change', e => { const id = e.target.id||''; if(id.startsWith('gq-')){ gq[id.slice(3)] = e.target.value; gAll=false; render(); } });
try{ const s=localStorage.getItem('eval-tab'); if(s&&R[s]) cur=s; }catch(_){}
if (D) render(); else app.innerHTML = '<p>This template has not been filled — run scripts/eval.mjs build.</p>';
</script></body></html>
