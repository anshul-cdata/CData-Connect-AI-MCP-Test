<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231d5fbf%22/%3E%3Cpath d=%22M9 17l4.5 4.5L23 11%22 stroke=%22white%22 stroke-width=%223.2%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* connector-qa capability report. Built by scripts/build-capability-report.mjs from the results
   store — never edit by hand. Layout: the answer first, tabs for the evidence. */
/* ── design tokens ─────────────────────────────────────────────────────────── */
:root{
  --bg:#f3f5f8;--surface:#fff;--surface-2:#f8fafc;--ink:#0f1b2d;--ink-2:#334155;--muted:#5b6778;--line:#e2e7ee;--line-strong:#cdd5e0;--soft:#eef2f6;
  --accent:#1d5fbf;--accent-soft:#e7effb;--ok:#1d7a4c;--ok-soft:#e3f3ea;--warn:#9a5a06;--warn-soft:#fcefd9;--bad:#b42318;--bad-soft:#fdeceb;
  --na:#687384;--na-soft:#eef1f5;--blue:#1d5fbf;--blue-soft:#e7effb;
  --hero-1:#0b1d36;--hero-2:#173a68;--hero-muted:#b6c4d8;
  --m0:#1d5fbf;--m1:#2f8a5b;--m2:#b0701f;--m3:#7454b8;--m4:#b0466c;--m5:#2a8a91;
  --vs-correct:#639922;--vs-correct-bg:#EAF3DE;--vs-correct-fg:#27500A;--vs-partly:#BA7517;--vs-partly-bg:#FAEEDA;--vs-partly-fg:#633806;
  --vs-incorrect:#E24B4A;--vs-incorrect-bg:#FCEBEB;--vs-incorrect-fg:#791F1F;--vs-unsupported:#7F77DD;--vs-unsupported-bg:#EEEDFE;--vs-unsupported-fg:#3C3489;
  --vs-refused:#D4537E;--vs-refused-bg:#FBEAF0;--vs-refused-fg:#72243E;--vs-account:#378ADD;--vs-account-bg:#E6F1FB;--vs-account-fg:#0C447C;
  --vs-data:#1D9E75;--vs-data-bg:#E1F5EE;--vs-data-fg:#085041;--vs-na:#B4B2A9;--vs-na-bg:#F1EFE8;--vs-na-fg:#444441;
  --shadow:0 1px 2px rgb(16 24 40 / .05),0 1px 3px rgb(16 24 40 / .05);--shadow-hover:0 4px 12px rgb(16 24 40 / .08);
  --radius:12px;
  --f-display:"Inter","Segoe UI",system-ui,sans-serif;--f-body:"Inter","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0c121a;--surface:#141c26;--surface-2:#18212d;--ink:#e7edf4;--ink-2:#c3cdd9;--muted:#93a1b2;--line:#253141;--line-strong:#324154;--soft:#1b2532;
  --accent:#7fb2f0;--accent-soft:#1a2c44;--ok:#5fc493;--ok-soft:#14301f;--warn:#e3a94f;--warn-soft:#36280f;--bad:#f08a80;--bad-soft:#3a1d1b;
  --na:#9aa5b2;--na-soft:#212b37;--blue:#7fb2f0;--blue-soft:#1a2c44;--hero-1:#08121f;--hero-2:#122a4b;
  --m0:#7fb2f0;--m1:#6fcf9b;--m2:#e0a865;--m3:#b39ae0;--m4:#e08aa6;--m5:#7fcbd0;
  --vs-correct:#97C459;--vs-correct-bg:#27500A;--vs-correct-fg:#C0DD97;--vs-partly:#EF9F27;--vs-partly-bg:#633806;--vs-partly-fg:#FAC775;
  --vs-incorrect:#F09595;--vs-incorrect-bg:#791F1F;--vs-incorrect-fg:#F7C1C1;--vs-unsupported:#AFA9EC;--vs-unsupported-bg:#3C3489;--vs-unsupported-fg:#CECBF6;
  --vs-refused:#ED93B1;--vs-refused-bg:#72243E;--vs-refused-fg:#F4C0D1;--vs-account:#85B7EB;--vs-account-bg:#0C447C;--vs-account-fg:#B5D4F4;
  --vs-data:#5DCAA5;--vs-data-bg:#085041;--vs-data-fg:#9FE1CB;--vs-na:#888780;--vs-na-bg:#444441;--vs-na-fg:#D3D1C7;
  --shadow:0 1px 2px rgb(0 0 0 / .3);--shadow-hover:0 4px 14px rgb(0 0 0 / .35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0c121a;--surface:#141c26;--surface-2:#18212d;--ink:#e7edf4;--ink-2:#c3cdd9;--muted:#93a1b2;--line:#253141;--line-strong:#324154;--soft:#1b2532;
  --accent:#7fb2f0;--accent-soft:#1a2c44;--ok:#5fc493;--ok-soft:#14301f;--warn:#e3a94f;--warn-soft:#36280f;--bad:#f08a80;--bad-soft:#3a1d1b;
  --na:#9aa5b2;--na-soft:#212b37;--blue:#7fb2f0;--blue-soft:#1a2c44;--hero-1:#08121f;--hero-2:#122a4b;
  --m0:#7fb2f0;--m1:#6fcf9b;--m2:#e0a865;--m3:#b39ae0;--m4:#e08aa6;--m5:#7fcbd0;
  --vs-correct:#97C459;--vs-correct-bg:#27500A;--vs-correct-fg:#C0DD97;--vs-partly:#EF9F27;--vs-partly-bg:#633806;--vs-partly-fg:#FAC775;
  --vs-incorrect:#F09595;--vs-incorrect-bg:#791F1F;--vs-incorrect-fg:#F7C1C1;--vs-unsupported:#AFA9EC;--vs-unsupported-bg:#3C3489;--vs-unsupported-fg:#CECBF6;
  --vs-refused:#ED93B1;--vs-refused-bg:#72243E;--vs-refused-fg:#F4C0D1;--vs-account:#85B7EB;--vs-account-bg:#0C447C;--vs-account-fg:#B5D4F4;
  --vs-data:#5DCAA5;--vs-data-bg:#085041;--vs-data-fg:#9FE1CB;--vs-na:#888780;--vs-na-bg:#444441;--vs-na-fg:#D3D1C7;
  --shadow:0 1px 2px rgb(0 0 0 / .3);--shadow-hover:0 4px 14px rgb(0 0 0 / .35)}

/* ── base ──────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;margin:0;overflow-x:clip;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.wrap{max-width:1320px;margin:0 auto;padding-inline:24px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:30px;font-weight:700;line-height:1.2}h2{font-size:20px;font-weight:650}h3{font-size:15.5px;font-weight:600}
p{margin:0;max-width:78ch}.muted{color:var(--muted)}.mono{font-family:var(--f-mono);font-size:12.5px}.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.tab,section{display:flex;flex-direction:column;gap:16px}.tab{gap:28px}.sec-head{display:flex;flex-direction:column;gap:6px}
.sec-head p{font-size:14px}

/* ── header band ───────────────────────────────────────────────────────────── */
.hero{background:radial-gradient(1200px 400px at 85% -20%,rgb(79 142 247 / .28),transparent 60%),linear-gradient(135deg,var(--hero-1),var(--hero-2));color:#fff}
.hero .wrap{padding-block:12px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600;color:var(--hero-muted);margin-bottom:2px}
.brand .logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#4f8ef7,#22b8a0);display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:-.04em}
.brand .kind{margin-left:auto;padding:3px 10px;border:1px solid rgb(255 255 255 / .22);border-radius:999px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#dbe5f2}
.hero h1{color:#fff;font-size:22px;line-height:1.25}
.hero .lede{color:var(--hero-muted);font-size:13.5px;line-height:1.5;max-width:none}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.meta>span{display:inline-flex;gap:6px;align-items:baseline;background:rgb(255 255 255 / .07);border:1px solid rgb(255 255 255 / .14);border-radius:7px;padding:3px 9px;font-size:12px;color:var(--hero-muted)}
.meta b{color:#fff;font-weight:600}.meta .mono{font-size:12px}
.meta>span.warnchip{background:rgb(245 166 35 / .16);border-color:rgb(245 166 35 / .45);color:#ffd99a}.meta>span.warnchip b{color:#ffd99a}

/* ── sticky tab bar ────────────────────────────────────────────────────────── */
.tabbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgb(16 24 40 / .04)}
.tabs{display:flex;flex-wrap:nowrap;gap:0;overflow-x:auto;scrollbar-width:thin}
.tabs button{font:inherit;font-size:13.5px;font-weight:500;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:13px 9px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:color .12s,border-color .12s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tabs .c{font-size:11px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 7px;line-height:1.5}
.tabs button[aria-selected="true"] .c{background:var(--accent-soft);color:var(--accent)}
button:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.page{padding-block:28px 48px;display:flex;flex-direction:column;gap:28px}

/* ── surfaces ──────────────────────────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.panel.note{border-left:4px solid var(--warn);background:var(--warn-soft)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--soft);gap:2px}.bar i{display:block;height:100%}
.bar .na{background:var(--na)}.dot.na{background:var(--na)}
.bar .y{background:var(--ok)}.bar .b{background:var(--blue)}.bar .p{background:var(--warn)}.bar .n{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}.legend span{display:inline-flex;align-items:center;gap:6px}
/* 3.7.3 — status colours by who the result is about: the AI (traffic lights), the CData connector
   (purple, pink), the test account (blue, teal), nobody (grey). Tokens below; dark values in both dark blocks. */
.bar .v-correct,.dot.v-correct{background:var(--vs-correct)}.bar .v-partly,.dot.v-partly{background:var(--vs-partly)}.bar .v-incorrect,.dot.v-incorrect{background:var(--vs-incorrect)}
.bar .v-unsupported,.dot.v-unsupported{background:var(--vs-unsupported)}.bar .v-blocked_connector,.dot.v-blocked_connector{background:var(--vs-refused)}
.bar .v-blocked_account,.dot.v-blocked_account{background:var(--vs-account)}.bar .v-blocked_data,.dot.v-blocked_data{background:var(--vs-data)}
.bar .v-not_applicable,.dot.v-not_applicable{background:var(--vs-na)}.bar .v-not_measured,.dot.v-not_measured{background:transparent;box-shadow:inset 0 0 0 1.5px var(--vs-na)}
.pill.v-correct{background:var(--vs-correct-bg);color:var(--vs-correct-fg)}.pill.v-partly{background:var(--vs-partly-bg);color:var(--vs-partly-fg)}.pill.v-incorrect{background:var(--vs-incorrect-bg);color:var(--vs-incorrect-fg)}
.pill.v-unsupported{background:var(--vs-unsupported-bg);color:var(--vs-unsupported-fg)}.pill.v-blocked_connector{background:var(--vs-refused-bg);color:var(--vs-refused-fg)}
.pill.v-blocked_account{background:var(--vs-account-bg);color:var(--vs-account-fg)}.pill.v-blocked_data{background:var(--vs-data-bg);color:var(--vs-data-fg)}
.pill.v-not_applicable{background:var(--vs-na-bg);color:var(--vs-na-fg)}.pill.v-not_measured{background:transparent;color:var(--vs-na-fg);box-shadow:inset 0 0 0 1px var(--vs-na);border:0;outline:1px dashed var(--vs-na);outline-offset:-1px}
.legend .grp{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}.legend .gl{font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}.dot.y{background:var(--ok)}.dot.p{background:var(--warn)}.dot.n{background:var(--bad)}.dot.b{background:var(--blue)}

/* ── tables ────────────────────────────────────────────────────────────────── */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom-color:var(--line-strong)}
tbody tr:hover td{background:var(--surface-2)}tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}

/* ── badges ────────────────────────────────────────────────────────────────── */
details.more{margin-top:6px}details.more>summary{cursor:pointer;font-size:13.5px;list-style:none}details.more pre{margin-top:6px}
.grade{display:inline-block;min-width:40px;text-align:center;font-size:12px;font-weight:650;padding:2px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 22%,transparent)}
.grade.blue{background:var(--blue-soft);color:var(--blue)}.grade.yellow{background:var(--warn-soft);color:var(--warn)}.grade.red{background:var(--bad-soft);color:var(--bad)}.grade.none{background:var(--na-soft);color:var(--na)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap;line-height:1.55}
.pill.y{background:var(--ok-soft);color:var(--ok)}.pill.p{background:var(--warn-soft);color:var(--warn)}.pill.n{background:var(--bad-soft);color:var(--bad)}.pill.na{background:var(--na-soft);color:var(--na)}
.pill.b{background:var(--blue-soft);color:var(--blue)}
.pill.who{background:var(--surface-2);color:var(--ink-2);font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.pill.src{background:var(--accent-soft);color:var(--accent);font-weight:500;text-decoration:none}a.pill.src:hover{text-decoration:underline}
.pill.ev-customer,.pill.ev-community{background:var(--ok-soft);color:var(--ok)}.pill.ev-vendor{background:var(--accent-soft);color:var(--accent)}.pill.ev-docs,.pill.ev-inferred{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}.pill.ev-inferred{font-style:italic}
a.mono.doc{color:inherit;text-decoration:underline dotted;text-underline-offset:2px}a.mono.doc:hover{color:var(--accent)}

/* ── controls ──────────────────────────────────────────────────────────────── */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters button,.filters select{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);border-radius:8px;padding:6px 13px;cursor:pointer}
.filters button:hover,.filters select:hover{border-color:var(--accent)}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.link{font:inherit;font-size:13.5px;font-weight:500;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:none;align-self:flex-start}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* ── AI journey ────────────────────────────────────────────────────────────── */
.journey{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.jstep{display:grid;grid-template-columns:24px 1fr;gap:12px;position:relative;padding-bottom:14px;font-size:13.5px}.jstep:last-child{padding-bottom:0}
.jstep::before{content:"";position:absolute;left:11px;top:24px;bottom:2px;width:2px;background:var(--line)}.jstep:last-child::before{display:none}
.jmark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.jmark.ok{background:var(--ok)}.jmark.err{background:var(--bad)}.jmark.fix{background:var(--warn)}.jmark.info{background:var(--na)}
.jhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.jtool{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.jkind{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.jtime{font-size:12px;color:var(--muted);margin-left:auto}
.jwhy{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.jerr{font-size:12.5px;color:var(--bad);white-space:pre-wrap;overflow-wrap:anywhere}
.jres{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
pre{margin:6px 0 2px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;overflow-x:auto;max-width:100%;font-family:var(--f-mono);font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}

/* ── misc ──────────────────────────────────────────────────────────────────── */
dl.kv{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:9px 18px;margin:0;font-size:13.5px}dl.kv dt{color:var(--muted)}dl.kv dd{margin:0}
.empty{color:var(--muted);font-style:italic}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px}

/* metric tooltips: one floating box, positioned in JS so table scroll containers never clip it */
.tip{text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px;cursor:help;border-radius:3px}
.tip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#tipbox{position:fixed;z-index:50;max-width:320px;background:#0f1b2d;color:#fff;font-size:12.5px;font-weight:400;line-height:1.5;letter-spacing:0;text-transform:none;padding:9px 12px;border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0 / .22);pointer-events:none;opacity:0;transition:opacity .1s}
#tipbox.on{opacity:1}

@media (max-width:640px){.wrap{padding-inline:16px}.tabs{scrollbar-width:none}.hero h1{font-size:19px}.brand .kind{display:none}dl.kv{grid-template-columns:1fr}}
/* printing or saving as PDF: the open tab, without the controls */
@media print{body{background:#fff;font-size:12px}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.tabbar{position:static;box-shadow:none}
  .tabs button:not([aria-selected="true"]){display:none}.panel,.tbl,.stat,.mcard,.uc,.finding,.persona{box-shadow:none;break-inside:avoid}.filters,#tipbox,.link{display:none}}

/* ── capability report: headline figures, use cases, personas ─────────────── */
.answer,.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.big{display:flex;align-items:baseline;gap:12px}.big .n{font-family:var(--f-display);font-size:46px;font-weight:750;line-height:1;letter-spacing:-.03em}.big .l{color:var(--muted);font-size:14px}
.minibar{width:150px;height:6px;margin-top:7px}
tr.total td{border-top:2px solid var(--line-strong);background:var(--surface-2)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em}.stat .k{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;font-size:13.5px}
.list li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}.list li:last-child{border-bottom:0;padding-bottom:0}
/* long monospace values (API paths, ids) wrap inside their cell instead of widening the table */
td.mono{overflow-wrap:anywhere;font-size:12.5px}th.r,td.r{text-align:right}th.nw,td.nw{white-space:nowrap}
table.fixed{table-layout:fixed}
.uc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s}
.uc>*{min-width:0}.uc details.more{grid-column:1/-1}.uc .pill.src{white-space:normal;overflow-wrap:anywhere}
.uc:hover{border-color:var(--line-strong);box-shadow:var(--shadow-hover)}
.uc-q{font-size:15px;font-weight:500;overflow-wrap:anywhere}.uc-id{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-right:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.metric{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}.metric b{font-family:var(--f-display);font-size:18px;font-weight:650}.metric span{font-size:12px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:9px}.hrow{display:grid;grid-template-columns:170px 1fr 56px;gap:12px;align-items:center;font-size:13px}
.htrack{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}.htrack i{display:block;height:100%;background:var(--accent);border-radius:999px}
.htrack i.y{background:var(--ok)}.htrack i.p{background:var(--warn)}.htrack i.n{background:var(--bad)}
.personas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.persona{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.persona .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.persona .frac{font-family:var(--f-display);font-weight:700;font-size:19px}
/* Grid and flex items default to min-width:auto and grow to fit their longest unbreakable line, so a long
   SQL statement, JSON input or error URL spills out of its column. Let every column shrink to its track
   and wrap its content instead. */
details.fold>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:2px}details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h3::before{content:"▸ ";color:var(--accent)}details.fold[open]>summary h3::before{content:"▾ "}
details.fold[open]>summary{margin-bottom:12px}
.told{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink-2)}.told span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.answer>*,.two>*,.uc>*,.list li>*,.jstep>div,.strip>*,.metrics>*,.personas>*{min-width:0}
@media (max-width:640px){.big .n{font-size:36px}.hrow{grid-template-columns:110px 1fr 44px}}

<script>
const DATA = /*__DATA__*/null;

const HELP = {
 "score": "Each use case gets 0–100, then they are averaged. The answer is worth 50 (correct 50, partial 25, wrong 0); efficiency 20, robustness 15 and speed and cost 15 are earned only in proportion to the answer, so a wrong answer scores 0. Efficiency and speed are measured against the other runs being compared.",

 "supported": "Supported: you can do this through CData ConnectAI MCP — the CData connector underneath exposes it fully as a table, column or procedure.",
 "partly": "Partly: only some of it works through CData ConnectAI MCP — for example read but not write, or some fields only.",

 "ucs": "Real business requests, each carried out end to end by a fresh AI agent that saw only the request and the MCP tools.",
 "causes": "Who owns each use case that did not end correct: connector (driver or server), usage instructions (what getInstructions failed to tell the agent: catalog, schema, required filters), metadata (the schema contradicts itself: a listed table or column is rejected), AI agent (it guessed wrong or answered a different question), test account (plan or rights), test data (nothing to find, or no record to change), source system (its own API does not offer it), test harness (a call refused before it reached the connector).",

const T = (label, k) => HELP[k] ? `<span class="tip" tabindex="0" data-tip="${esc(HELP[k])}" aria-label="${esc(String(label).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' '))}: ${esc(HELP[k])}">${label}</span>` : label;
(function tipbox(){

  + (u.source ? (u.source.url ? `<a class="pill src" href="${esc(u.source.url)}" target="_blank" rel="noopener">${esc(u.source.title||u.source.kind)}</a>` : `<span class="pill src">${esc(u.source.title||u.source.kind)}</span>`) : '');

  const cmp = by==='evidence' ? (a,b)=>EVORD.indexOf(a.evidence||'inferred')-EVORD.indexOf(b.evidence||'inferred') : by==='area' ? (a,b)=>String(a.area||'~').localeCompare(String(b.area||'~')) : (a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true});

/* What the usage instructions did and did not do for the agents */

    <div class="stat"><span class="v">${I.failed_calls}</span><span class="k">failed calls charged to the instructions</span></div><div class="stat"><span class="v">${I.tests_hit}</span><span class="k">use cases affected</span></div></div>
    ${(I.topics||[]).length?`<div class="tbl"><table><thead><tr><th>What the instructions should say</th><th>Suggested line</th><th>Owner today</th><th class="r">Failed calls</th><th class="r">Use cases</th></tr></thead><tbody>
      ${I.topics.map(t=>`<tr><td><b>${esc(t.label)}</b></td><td>${esc(t.line)}</td><td>${t.charged?'<span class="pill p">Usage instructions</span>':'<span class="pill who">Other owner, instructions would help</span>'}</td><td class="r num">${t.calls}</td><td class="r num">${t.tests}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">No failed call that better instructions would have prevented.</p>'}
    ${I.sample?`<details><summary class="link">What the agents were told</summary><pre>${esc(I.sample)}</pre></details>`:''}</div>`;
}
let ucFilter = 'all', ucArea = '', ucPersona = '', ucSort = '', ucEv = '';
function ucCard(u){
  return `<div class="uc"><span class="uc-q"><span class="uc-id">${esc(u.id)}</span>"${esc(u.request)}"</span>
    <button type="button" class="link" data-uc="${esc(u.id)}">Open full detail →</button>
    <span class="tags">${VP(u.verdict)}${PROBE(u.probe)}${u.verdict&&['correct','partly','incorrect'].includes(u.verdict)?G(u.score,u.grade):''}${u.phrasings>1?`<span class="pill who">${u.phrasings} wordings${u.phrasings_agree===false?' · outcomes differ':''}</span>`:''}${u.persona?`<span class="pill who">${esc(u.persona)}</span>`:''}${u.area?`<span class="pill who">${esc(u.area)}</span>`:''}${u.kind?`<span class="pill who">${esc(u.kind)}</span>`:''}${u.difficulty?`<span class="pill who">${esc(u.difficulty)}</span>`:''}${u.pattern?`<span class="pill who">${esc(PAT[u.pattern]||u.pattern)}</span>`:''}${EVP(u)}${u.cause?`<span class="pill who">Cause: ${esc(CAUSE[u.cause]||u.cause)}</span>`:''}${u.metrics?`<span class="pill who num">${u.metrics.calls} calls · ${u.metrics.failed} failed</span>`:''}</span></div>`;
}
function useCases(){
  if (D.analysis) return aUseCases();
  const areas = [...new Set(D.use_cases.map(u=>u.area).filter(Boolean))].sort();
  const ucPersonas = [...new Set(D.use_cases.map(u=>u.persona).filter(Boolean))].sort();
  const vi = v => { const i = VORD.indexOf(v); return i < 0 ? VORD.length : i; };
  const list = sortUc(evFilter(D.use_cases.filter(u => (ucFilter==='all' || u.verdict===ucFilter) && (!ucArea||u.area===ucArea) && (!ucPersona||u.persona===ucPersona))
    .sort((a,b)=>vi(a.verdict)-vi(b.verdict) || (a.score??101)-(b.score??101)), ucEv), ucSort);
  const vc = D.ucs.verdicts || {};
  return `<div class="sec-head"><h2>Use cases</h2><p class="muted">Each is a real request from a real source, carried out by a fresh AI agent that saw only the request and the MCP tools. AI mistakes first, then what blocked the rest. Open one to see its full journey. ${T('How scores are coloured','grades')}.</p></div>
  <div class="filters" role="group" aria-label="Filter use cases">${[['all','All',D.use_cases.length],...Object.keys(VL).filter(k=>vc[k]).map(k=>[k,VL[k],vc[k]])].map(([k,l,n])=>`<button type="button" data-f="${k}" aria-pressed="${ucFilter===k}">${l} <span class="muted num">${n}</span></button>`).join('')}
    <label class="muted" for="area-filter" style="font-size:13px;margin-left:8px">Area</label><select id="area-filter"><option value="">All areas</option>${areas.map(a=>`<option ${a===ucArea?'selected':''}>${esc(a)}</option>`).join('')}</select>
    <label class="muted" for="persona-filter" style="font-size:13px;margin-left:8px">Persona</label><select id="persona-filter"><option value="">All personas</option>${ucPersonas.map(x=>`<option ${x===ucPersona?'selected':''}>${esc(x)}</option>`).join('')}</select>
    ${ucControls(D.use_cases, ucSort, ucEv, ['uc-ev','uc-sort'])}
    <span class="muted num" style="font-size:13px">${list.length} shown</span></div>
  <div class="tab" style="gap:10px">${list.map(ucCard).join('') || '<p class="empty">No use case matches.</p>'}</div>`;
}
function stepHtml(s){
  const mark = s.ok ? (s.recovery_of ? 'fix' : (s.category==='discovery'?'info':'ok')) : 'err';
  const kind = (s.recovery_of ? `recovery of ${s.recovery_of}` : s.retry_of ? `${s.category} · retry of ${s.retry_of}` : s.category) + (s.turn===2?' · after the reply':'');
  return `<li class="jstep"><span class="jmark ${mark}">${s.n}</span><div>
    <div class="jhead"><span class="jtool">${esc(s.tool)}</span><span class="jkind">${esc(kind)}</span>${s.ms!=null?`<span class="jtime num">${(s.ms/1000).toFixed(1)} s</span>`:''}</div>
    ${s.reason?`<div class="jwhy">Reason given: "${esc(s.reason)}"</div>`:''}
    ${s.input?`<pre>${esc(s.input)}</pre>`:''}
    ${s.ok?(s.result?`<div class="jres">Result${s.rows!=null?` · ${s.rows} rows`:''}: ${esc(String(s.result).slice(0,1500))}</div>`:''):`<div class="jerr">Error · ${esc(s.error_class)} · cause: ${esc(CAUSE[s.cause]||s.cause)} · ${esc(s.error)}</div>`}
  </div></li>`;
}
/* 3.7.2 — the use case page answers the reader's own questions in plain words: how do we know the
 * answer is correct, how many times we asked, why the score, and earlier runs. Queries and codes stay
 * one click away. */
const RUN_LABEL = {correct:'Correct',partial:'Partly correct',wrong:'Incorrect',no_test_data:'Blocked by test data',blocked_account:'Blocked by the account',
  blocked_connector:'Refused by the connector',not_possible:'Not supported',not_run:'Not run',needs_judgement:'Awaiting the judge',not_checked:'Not checked',not_applicable:'Not applicable'};
const RULE_TEXT = {
  same_ids:'the answer must name exactly the records our check found',
  contains:'every record our check found must be in the answer',
  same_count:'the answer must give the same number our check found',
  values_within:'the numbers in the answer must match our check, record by record',
  write_visible:'the change must show in the data afterwards, and nothing else may change',
  judge:'no query can decide this one, so a fixed AI judge read the answer'};
const nameOf = r => { if(!r) return ''; const k = Object.keys(r); const pick = k.find(c=>/^(name|title|subject|label|summary)$/i.test(c)) || k.find(c=>/name$/i.test(c)) || k.find(c=>!/id$/i.test(c) && typeof r[c]==='string'); return pick ? String(r[pick]) : String(r[k[0]]??''); };
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;
/* the AI's call our check re-ran: the last call whose input is that query */
const reranStep = u => { const q = String(u.check?.agent_sql||'').replace(/\s+/g,' ').trim(); if(!q) return null; const s = [...(u.steps||[])].reverse().find(x => String(x.input||'').replace(/\s+/g,' ').includes(q.slice(0, 120))); return s ? s.n : null; };

const raw = (d, label) => d ? `<details class="more"><summary class="link">${label}</summary><p class="muted" style="font-size:13px">${esc(d)}</p></details>` : '';
function howChecked(u){
  const c = u.check || {}, v = u.verdict, d = c.detail || u.reason || '';
  const show = [];
  if (c.reference_sql) show.push(`<details class="more"><summary class="link">Show our check query</summary><pre>${esc(c.reference_sql)}</pre></details>`);
  const rn = reranStep(u);
  if (c.agent_sql) show.push(`<details class="more"><summary class="link">Show the AI's query we re-ran${rn?` (call ${rn})`:''}</summary><pre>${esc(c.agent_sql)}</pre><p class="muted" style="font-size:13px">${c.agent_rows_count!=null?`It returned ${plural(c.agent_rows_count,'record')} when we re-ran it, so the records the AI used are real.`:''}</p></details>`);
  let body;
  if (u.probe) body = `<p>This request needs something CData ConnectAI MCP does not offer${u.reason?`: ${esc(u.reason.replace(/^Not possible through the connector:\s*/,''))}`:''}. We still asked the AI once, to see whether it would say so plainly or invent an answer.</p><p>${PROBE(u.probe)} ${esc(u.probe.detail||'')}</p>`;
  else if (v==='unsupported' || v==='not_applicable') body = `<p>Not asked. ${v==='unsupported'?'It needs something the source can do but CData ConnectAI MCP does not offer':'It needs something that exists only inside the source\'s own app'}${d?`: ${esc(String(d).replace(/^Not possible through the connector:\s*/i,'').replace(/\.+$/,''))}`:''}.</p>`;
  else if (v==='blocked_account') body = `<p>${esc(D.connector)} refused this for the test account's plan or rights, and the AI told the user so. It counts neither for nor against the AI; an account with this feature would test it.</p>${raw(d,'Show what the source returned')}`;
  else if (v==='blocked_connector') body = `<p>The connector refused the operation or did not answer, and the AI told the user so. This is a connector finding, not an AI mistake.</p>${raw(d,'Show what the connector returned')}`;
  else if (v==='blocked_data') body = `<p>There was nothing in the test account to check the answer against, so this run measured nothing. Add the records to the test account and run it again.</p>${raw(d,'Show the details')}`;
  else if (v==='not_measured') body = `<p>Not measured yet: ${esc(d || 'no result recorded')}.</p>`;
  else if (c.rule==='write_visible') body = `<p>Before the AI started, we read the records this change should touch${c.before_count!=null?` (${plural(c.before_count,'record')})`:''}; after it finished, we read them again${c.reference_count!=null?` (${plural(c.reference_count,'record')})`:''}. The AI never sees these reads. The rule: ${RULE_TEXT.write_visible}.</p><p>What we found: ${esc(d)}.</p>`;
  else if (c.rule==='judge' || /judge/i.test(d)) body = `<p>No query can decide this one: several answers can be right, or the right move is to ask the user. A fixed AI judge read the request, what was expected, the AI's answer${c.data_count!=null?' and the data in the account':''}, and decided:</p><p>"${esc(d.replace(/^.*judge:\s*/i,''))}"</p>${u.second_judge?`<p class="muted">A second AI judge, from a different model, ${u.second_judge.agree?'agreed':`disagreed (it said ${esc(RUN_LABEL[u.second_judge.outcome]||u.second_judge.outcome)}) — a person should look at this one`}.</p>`:''}`;
  else {
    const rows = c.reference_rows || [], n = c.reference_count ?? rows.length;
    const names = rows.slice(0, 8).map(nameOf).filter(Boolean);
    body = `<p>After the AI finished, we ran our own check on the same ${esc(D.connector)} data. The AI never sees it. It found ${plural(n,'record')}${names.length?':':'.'}</p>
      ${names.length?`<ul class="list" style="margin:4px 0 8px">${names.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}${n>names.length?`<li><span class="muted">and ${n-names.length} more</span></li>`:''}</ul>`:''}
      <p>The rule: ${RULE_TEXT[c.rule]||'the answer is compared with our check'}. What we found: ${esc(d)}.</p>`;
  }
  return `<div class="panel"><h3>How do we know the answer is correct?</h3>${body}<p style="margin-top:6px">Result: ${VP(u.verdict)}</p>${show.join('')}</div>`;
}

function consistency(u){
  const at = u.attempts || []; if (!at.length) return '';
  if (['unsupported','not_applicable'].includes(u.verdict) && !u.probe && at.every(t => !t.calls))
    return `<div class="panel"><h3>How many times did we ask?</h3><p>Not asked. No AI was given this request, because CData ConnectAI MCP cannot do what it needs — the answer would be "not possible" whatever the AI did.</p></div>`;
  const fails = t => { const f = t.failed_steps || []; if (!f.length) return 'none'; const fixed = f.filter(x=>x.recovered).length, left = f.length - fixed;
    return [fixed?`${fixed} fixed by the AI`:'', left?`${left} ${f.some(x=>!x.recovered && x.cause==='account')?'refused by the account':f.some(x=>!x.recovered && x.cause==='connector')?'refused by the connector':'not fixed'}`:''].filter(Boolean).join(', ') + ` (call ${f.map(x=>x.n).join(', ')})`; };
  const often = u.priority==='P1' ? 'Daily questions are asked 3 times, each by a fresh AI, to check it is reliable and not lucky.' : 'Weekly and less frequent questions are asked once; daily ones 3 times, each by a fresh AI.';
  if (at.length === 1) { const t = at[0];
    return `<div class="panel"><h3>How many times did we ask?</h3><p>Once. ${often}</p><p class="muted">That run: ${esc(RUN_LABEL[t.outcome]||t.outcome)}${t.score!=null?` · score ${t.score}`:''} · ${plural(t.calls??0,'data request')}${(t.failed_steps||[]).length?`, failed: ${esc(fails(t))}`:', none failed'}.</p></div>`; }
  const same = new Set(at.map(t=>t.outcome)).size === 1, ok = at.filter(t=>t.outcome==='correct').length;
  const words = [...new Set(at.map(t=>t.variant||0))];
  const tally = Object.entries(at.reduce((m,t)=>(m[t.outcome]=(m[t.outcome]||0)+1,m),{})).sort((a,b)=>b[1]-a[1]).map(([o,n])=>`${n} ${(RUN_LABEL[o]||o).toLowerCase()}`).join(', ');
  const head = same ? `${esc(RUN_LABEL[at[0].outcome]||at[0].outcome)} all ${at.length} times, each by a fresh AI. Same outcome every time.`
    : ok ? `Correct in ${ok} of ${at.length} runs, each by a fresh AI. The runs did not agree (${tally}) — open the journey to see what differed.`
    : `The ${at.length} runs, each by a fresh AI, ended differently: ${tally}.`;
  const wordingOf = t => !t.variant ? 'As written' : `Variant ${t.variant}`;
  return `<div class="panel"><h3>How many times did we ask?</h3><p>${head} ${words.length>1?`Asked in ${words.length} different wordings.`:''}</p>
    ${words.length>1?`<p class="muted" style="font-size:13px">As written: "${esc(u.request)}"${(u.variants||[]).map((x,i)=>`<br>Variant ${i+1}: "${esc(x)}"`).join('')}</p>`:''}
    <div class="tbl"><table class="num" style="min-width:420px"><thead><tr><th>Run</th><th>Wording</th><th>Result</th><th>Score</th><th>Data requests</th><th>Requests that failed</th></tr></thead><tbody>
    ${at.map((t,i)=>`<tr><td>${i+1}</td><td>${wordingOf(t)}</td><td>${esc(RUN_LABEL[t.outcome]||t.outcome)}</td><td>${t.score??'—'}</td><td>${t.calls??'—'}</td><td>${esc(fails(t))}</td></tr>`).join('')}</tbody></table></div>
    ${at.some(t=>t.score==null)?`<p class="muted" style="font-size:13px">— = not scored: a run that was blocked or not decided does not test the AI.</p>`:''}</div>`;
}

function scoreWhy(u){
  if (u.score==null) return '';
  const p = u.parts || {}, m = u.metrics || {}, W = D.run.weights || {correctness:50,efficiency:20,robustness:15,speed:15};
  const row = (txt, k) => `<div class="hrow"><span>${txt}</span><span class="htrack"><i class="${p[k]==null?'na':p[k]/W[k]>=.85?'y':p[k]/W[k]>=.5?'p':'n'}" style="width:${p[k]==null?0:pct(p[k],W[k])}"></i></span><span>${p[k]==null?'—':`${Math.round(p[k])} / ${W[k]}`}</span></div>`;
  const ans = u.outcome==='correct' ? 'The answer was correct' : u.outcome==='partial' ? 'The answer was partly correct' : 'The answer was incorrect, so the other parts score nothing';
  const acting = m.acting_calls ?? m.calls;
  const qc = n => `${n} ${n===1?'query or change':'queries or changes'}`;
  const eff = p.efficiency!=null && p.efficiency >= W.efficiency*.95 ? `It took the shortest path (${qc(acting??0)})` : `It took ${qc(acting??0)}; the shortest path found for this question took fewer`;
  const rob = !m.failed ? 'No request failed' : `${plural(m.failed,'request')} failed${m.recoveries?`, ${m.recoveries} fixed by the AI`:''}${m.dead_ends?`, ${plural(m.dead_ends,'dead end')}`:''}${m.repeated?`, ${m.repeated} repeated`:''}`;
  const spd = p.speed==null ? 'Speed and cost were not measured in this run' : 'Speed and cost against the norm for this kind of task';
  return `<div class="panel"><h3>Why is the score ${u.score}${u.score<100?' and not 100':''}?</h3><div class="hist num">${row(ans,'correctness')}${row(eff,'efficiency')}${row(rob,'robustness')}${row(spd,'speed')}</div>
    <p class="muted" style="font-size:13px">${u.grade==='blue'?'85 or more with a correct answer: it worked smoothly.':u.grade==='yellow'&&u.outcome==='correct'?'A correct answer below 85: it worked, with some friction.':u.outcome==='partial'?'Partly correct.':'Incorrect answer.'}${m.time_ms?` · ${(m.time_ms/1000).toFixed(0)} s`:''}${m.tokens?` · ${(m.tokens/1000).toFixed(1)}k tokens`:''}</p></div>`;
}

    const n = x.total, cd = x.both + x.cdata_only, vd = x.both + x.vendor_only, none = x.neither + x.app_only + x.unmapped;
    const meter = (v, cls) => `<div class="bar minibar" role="img" aria-label="${v} of ${n}"><i class="${cls}" style="width:${pct(v,n)}"></i></div>`;
    const diff = [x.cdata_only?`<span class="pill b">+${x.cdata_only} only CData</span>`:'', x.vendor_only?`<span class="pill n">+${x.vendor_only} only vendor</span>`:''].filter(Boolean).join(' ') || '<span class="muted">same</span>';

    return `<tr${total?' class="total"':''}><td>${T(esc(name))}</td><td>${T(n)}</td><td>${T(`${cd} of ${n}`)}${meter(cd,'b')}</td><td>${T(`${vd} of ${n}`)}${meter(vd,'y')}</td><td>${diff}</td><td class="muted">${none}${x.app_only?` <span style="font-size:12.5px">(${x.app_only} app only)</span>`:''}${x.unmapped?` <span style="font-size:12.5px">(${x.unmapped} not compared)</span>`:''}</td></tr>`;

  account_empty:'Every table it reads is empty in the test account. Seed test data first, or a run measures an empty account.',
  unknown:'It names a capability the capability list does not have. Fix the catalog before running it.'};
const OP = o => `<span class="pill ${OC[o]||'na'} tip" tabindex="0" data-tip="${esc(OHELP[o]||'')}">${esc(OL[o]||o)}</span>`;
const obar = (v, total) => `<div class="bar" role="img" aria-label="${Object.keys(OL).filter(k=>v[k]).map(k=>`${v[k]} ${OL[k].toLowerCase()}`).join(', ')}">${Object.keys(OL).filter(k=>v[k]).map(k=>`<i class="${OC[k]}" style="width:${pct(v[k],total)}"></i>`).join('')}</div>`;
const olegend = v => `<div class="legend num" style="flex-direction:column;align-items:flex-start;gap:6px">${Object.keys(OL).filter(k=>v[k]).map(k=>`<span><span class="dot ${OC[k]}"></span><b>${v[k]}</b>&nbsp;${T(OL[k].toLowerCase(),'o_'+k)}</span>`).join('')}</div>`;
for (const [k,t] of Object.entries(OHELP)) HELP['o_'+k] = t;
function aSummary(){
  const c = D.caps, A = D.analysis, n = A.use_cases.length, o = A.outlook, ap = c.total;
  const topGaps = D.gaps.filter(g=>g.blocked).slice(0,3);
  return `<div class="answer">
    <div class="panel"><span class="eyebrow">${esc(D.connector)} capabilities</span>
      <div class="big"><span class="n num">${ap}</span><span class="l">${T(`things ${esc(D.connector)}'s API can do`,'caps')}</span></div>
      <div class="bar" role="img" aria-label="${c.supported} supported, ${c.partly} partly, ${c.not_exposed} not supported, ${c.product_only} not applicable"><i class="y" style="width:${pct(c.supported,ap)}"></i><i class="p" style="width:${pct(c.partly,ap)}"></i><i class="n" style="width:${pct(c.not_exposed,ap)}"></i><i class="na" style="width:${pct(c.product_only,ap)}"></i></div>
      <div class="legend num"><span><span class="dot y"></span><b>${c.supported}</b>&nbsp;${T('supported','supported')}</span><span><span class="dot p"></span><b>${c.partly}</b>&nbsp;${T('partly supported','partly')}</span><span><span class="dot n"></span><b>${c.not_exposed}</b>&nbsp;${T('not supported','notpossible')}</span><span><span class="dot na"></span><b>${c.product_only}</b>&nbsp;${T('not applicable','notapplicable')}</span></div>
      <p class="muted" style="font-size:13.5px">One capability is one operation ${esc(D.connector)}'s API documents — <span class="mono">Query Invoice</span>, <span class="mono">Create Bill</span> — which CData ConnectAI MCP turns into a table to query, a column to write, or a procedure to call. <button type="button" class="link" data-go="caps">See all ${ap} and what each becomes</button><br>Not supported is a CData gap: the API offers it, CData ConnectAI MCP does not. Not applicable is not: it exists only in ${esc(D.connector)}'s own app.${c.not_applicable?` ${c.not_applicable} API operations (sign-in, webhooks…) are not data capabilities and are left out.`:''}${PROV()?` <b>${PROV()}</b>`:''}</p></div>
    <div class="panel"><span class="eyebrow">Real business use cases · not run yet</span>
      <div class="big"><span class="n num">${n}</span><span class="l">use cases found, with what each is expected to meet</span></div>
      ${n?obar(o,n)+olegend(o)+EVLINE(A.use_cases):'<p class="empty">No use cases researched yet.</p>'}
      <p class="muted" style="font-size:13.5px">${n?`${o.ready+o.partly} of ${n} can test the AI once run${o.partly?` (${o.partly} of them lean on a partly supported capability)`:''}. ${o.unsupported+o.not_applicable} are expected to end as not supported or not applicable whatever the AI does${o.account_refused+o.account_empty?`, and ${o.account_refused+o.account_empty} need a better test account or seeded data first`:''}.`:''}</p></div></div>
  ${refPanel()}
  <div class="two">
    <div class="panel"><h3>Biggest gaps vs the API</h3>${topGaps.length?`<ul class="list num">${topGaps.map(g=>`<li><span>${esc(g.label)}</span><span class="pill ${g.bucket}">${g.blocked} use case${g.blocked===1?'':'s'} need it</span></li>`).join('')}</ul>`:'<p class="empty">No researched use case needs a gap.</p>'}<button type="button" class="link" data-go="gaps">See all ${D.gaps.length} gaps vs the API</button></div>
    <div class="panel"><h3>Test account readiness</h3>${A.account_probed?`<ul class="list num">${A.readiness.map(r=>`<li><span>${esc(r.name)}<br><span class="muted" style="font-size:12.5px">${r.tables?`${r.data} of ${r.tables} tables hold data${r.refused?` · ${r.refused} refused by the plan`:''}${r.empty?` · ${r.empty} empty`:''}${r.needs_filter?` · ${r.needs_filter} need a filter to read`:''}`:'no table probed'}</span></span><span class="pill ${!r.tables?'na':r.refused||r.data<r.tables/2?'p':'y'}">${r.tables?Math.round(100*r.data/r.tables)+'%':'—'}</span></li>`).join('')}</ul>`:'<p class="empty">Not probed. Run the account probe (Stage 1.5d) to see what the test account can show.</p>'}</div></div>`;
}
let aFilter = 'all', aArea = '', aSort = '', aEv = '', aPersona = '';
function aCard(u){
  return `<div class="uc"><span class="uc-q"><span class="uc-id">${esc(u.id)}</span>"${esc(u.request)}"</span>
    <span class="tags">${OP(u.outlook)}<span class="pill v-not_measured">Not run yet</span>${u.persona?`<span class="pill who">${esc(u.persona)}</span>`:''}${u.area?`<span class="pill who">${esc(u.area)}</span>`:''}${u.kind?`<span class="pill who">${esc(u.kind)}</span>`:''}${u.difficulty?`<span class="pill who">${esc(u.difficulty)}</span>`:''}${u.pattern?`<span class="pill who">${esc(PAT[u.pattern]||u.pattern)}</span>`:''}${EVP(u)}</span>
    <details class="more"><summary class="link">Why this use case exists, what it needs, and what a correct answer does</summary>
      <div class="two">
        <div class="panel"><h3>Why this use case exists</h3><dl class="kv">
          <dt>Who</dt><dd>${esc(u.persona||'—')}</dd>${u.moment?`<dt>When</dt><dd>${esc(u.moment)}</dd>`:''}<dt>Goal</dt><dd>${esc(u.goal||'—')}</dd>
          ${u.frequency?`<dt>How often</dt><dd>${esc(u.frequency)}</dd>`:''}<dt>Source</dt><dd>${u.source?esc(`${u.source.kind}: ${u.source.title}`)+(u.source.url?` · <span class="mono">${esc(u.source.url)}</span>`:''):'—'}</dd>
          <dt>${T('Evidence','evidence')}</dt><dd>${esc(EVL[u.evidence]||'—')}</dd>
          ${u.difficulty?`<dt>${T('Difficulty','tags')}</dt><dd>${esc(u.difficulty)} · ${esc(PAT[u.pattern]||'')}${(u.tests||[]).length?` · tests ${esc(u.tests.join(', ').replace(/_/g,' '))}`:''}</dd>`:''}
          <dt>Realism</dt><dd>${u.realism!=null?u.realism+' / 5 (judge)':'—'}${u.human?` · human rated ${esc(u.human.rating)}`:''}</dd>
          ${u.variants?`<dt>Other wordings</dt><dd>${u.variants} variant${u.variants===1?'':'s'}, judged separately</dd>`:''}</dl></div>
        <div class="panel"><h3>What it needs from ${esc(D.connector)}</h3><ul class="list">${u.capabilities.map(c=>`<li><span>${esc(c.label)}<br><span class="mono muted">${API(c)}</span></span>${ST(c.status)}</li>`).join('')||'<li class="empty">—</li>'}</ul></div></div>
      <div class="panel"><h3>What a good answer does</h3>${u.expected.length?`<ul class="list">${u.expected.map(e=>`<li><span>${esc(e)}</span></li>`).join('')}</ul>`:'<p class="empty">No expected behaviour recorded.</p>'}</div></details></div>`;
}
function aUseCases(){
  const all = D.analysis.use_cases, o = D.analysis.outlook;
  const areas = [...new Set(all.map(u=>u.area).filter(Boolean))].sort();
  const personas = [...new Set(all.map(u=>u.persona).filter(Boolean))].sort();
  const list = sortUc(evFilter(all.filter(u => (aFilter==='all' || u.outlook===aFilter) && (!aArea||u.area===aArea) && (!aPersona||u.persona===aPersona)), aEv), aSort);
  return `<div class="sec-head"><h2>Use cases, not run yet</h2><p class="muted">Each is a real request from a real source. The outlook is what a run is expected to meet, read from the capabilities it needs${D.analysis.account_probed?' and the test account':''}. It is not a result.</p></div>
  <div class="filters" role="group" aria-label="Filter use cases">${[['all','All',all.length],...Object.keys(OL).filter(k=>o[k]).map(k=>[k,OL[k],o[k]])].map(([k,l,n])=>`<button type="button" data-af="${k}" aria-pressed="${aFilter===k}">${esc(l)} <span class="muted num">${n}</span></button>`).join('')}
    <label class="muted" for="a-area-filter" style="font-size:13px;margin-left:8px">Area</label><select id="a-area-filter"><option value="">All areas</option>${areas.map(a=>`<option ${a===aArea?'selected':''}>${esc(a)}</option>`).join('')}</select>
    <label class="muted" for="a-persona-filter" style="font-size:13px;margin-left:8px">Persona</label><select id="a-persona-filter"><option value="">All personas</option>${personas.map(x=>`<option ${x===aPersona?'selected':''}>${esc(x)}</option>`).join('')}</select>
    ${ucControls(all, aSort, aEv, ['a-ev','a-sort'])}
    <span class="muted num" style="font-size:13px">${list.length} shown</span></div>
  <div class="tab" style="gap:10px">${list.map(aCard).join('') || '<p class="empty">No use case matches.</p>'}</div>`;
}
function aAreas(){
  if(areaOpen) return aAreaDetail(areaOpen);
  const R = new Map(D.analysis.readiness.map(r=>[r.id,r]));
  return `<div class="sec-head"><h2>By business area</h2><p class="muted">Capabilities, use cases found and the test account, per area. Open an area to see every capability in it.</p></div>
  <div class="tbl"><table class="num"><thead><tr><th>Business area</th><th>Capabilities</th><th>Use cases</th><th>Test account</th><th></th></tr></thead><tbody>${D.areas.map(a=>{const c=a.caps.y+a.caps.p+a.caps.n+(a.caps.na||0), r=R.get(a.id)||{use_cases:0,outlook:{}};return `<tr><td><b>${esc(a.name)}</b></td>
    <td>${a.caps.y} of ${c} supported${a.caps.p?` · ${a.caps.p} partly`:''}${a.caps.n?` · ${a.caps.n} not supported`:''}${a.caps.na?` · ${a.caps.na} not applicable`:''}<div class="bar minibar"><i class="y" style="width:${pct(a.caps.y,c)}"></i><i class="p" style="width:${pct(a.caps.p,c)}"></i><i class="n" style="width:${pct(a.caps.n,c)}"></i></div></td>
    <td>${!r.use_cases?'<span class="muted">not researched yet</span>':`${r.outlook.ready||0} of ${r.use_cases} ready${obar(r.outlook,r.use_cases).replace('class="bar"','class="bar minibar"')}`}</td>
    <td>${D.analysis.account_probed&&r.tables?`${r.data} of ${r.tables} tables hold data${r.refused?` · ${r.refused} refused`:''}`:'<span class="muted">—</span>'}</td>
    <td><button type="button" class="link" data-area="${esc(a.id)}">View&nbsp;details&nbsp;→</button></td></tr>`;}).join('')}</tbody></table></div>`;
}
function aAreaDetail(id){
  const a = D.areas.find(x=>x.id===id); if(!a) return '';
  const r = D.analysis.readiness.find(x=>x.id===id) || {use_cases:0,outlook:{}};
  const ucs = D.analysis.use_cases.filter(u=>u.area_id===id);
  const c = a.caps.y+a.caps.p+a.caps.n+(a.caps.na||0);
  return `<button type="button" class="link" data-areaback="1">← All business areas</button>
  <div class="sec-head"><span class="eyebrow">Business area</span><h2>${esc(a.name)}</h2></div>
  <div class="strip num"><div class="stat"><span class="v">${a.caps.y} / ${c}</span><span class="k">capabilities supported</span></div><div class="stat"><span class="v">${r.use_cases}</span><span class="k">use cases found</span></div><div class="stat"><span class="v">${r.outlook.ready||0}</span><span class="k">ready to test</span></div>${D.analysis.account_probed?`<div class="stat"><span class="v">${r.data} / ${r.tables}</span><span class="k">tables with data in the test account</span></div>`:''}</div>
  ${r.use_cases?obar(r.outlook,r.use_cases)+olegend(r.outlook):''}
  ${(r.refused_tables||[]).length||(r.empty_tables||[]).length?`<p class="note" role="note" style="font-size:13.5px">${r.refused_tables.length?`Refused by the test account's plan: ${esc(r.refused_tables.join(', '))}. `:''}${r.empty_tables.length?`Empty in the test account: ${esc(r.empty_tables.join(', '))}.`:''}</p>`:''}
  <section><div class="sec-head"><h3>Every capability in this area</h3></div><div class="tbl"><table class="num"><thead><tr><th>Capability</th><th>API</th><th>Offered through ConnectAI MCP as</th><th>Result</th><th>Use cases that need it</th></tr></thead><tbody>${a.capabilities.map(k=>`<tr><td>${esc(k.label)}</td><td class="mono">${API(k)}</td><td class="mono">${esc(k.exposure)}</td><td>${ST(k.status)}</td><td>${k.needed||'<span class="muted">none</span>'}</td></tr>`).join('')}</tbody></table></div></section>
  <section><div class="sec-head"><h3>Use cases</h3></div><div class="tbl"><table><thead><tr><th>ID</th><th>Request</th><th>Persona</th><th>Outlook</th></tr></thead><tbody>${ucs.map(u=>`<tr><td class="mono">${esc(u.id)}</td><td>"${esc(u.request)}"</td><td>${esc(u.persona||'')}</td><td>${OP(u.outlook)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No use cases in this area yet.</td></tr>'}</tbody></table></div></section>`;
}
function aRun(){
  const r = D.run, A = D.analysis;
  return `<div class="two"><div class="panel"><h3>What this analysis read</h3><dl class="kv num"><dt>Capability list</dt><dd>${r.capability_source?esc(`${r.capability_source.title||''} ${r.capability_source.version||''} · read ${String(r.capability_source.read_at||'').slice(0,10)}`):'—'}${PROV()?`<br><span class="muted" style="font-size:13px">${PROV()}</span>`:''}</dd>
    <dt>Use case catalog</dt><dd>${r.catalog_version!=null?'v'+esc(r.catalog_version):'—'}${A.researched_at?` · updated ${esc(String(A.researched_at).slice(0,10))}`:''}</dd>
    <dt>Test account probe</dt><dd>${A.account_probed?esc(String(A.account_at||'').slice(0,10)):'not run'}</dd>${ORCH()}<dt>Skill version</dt><dd>${esc(r.skill_version||'—')}</dd></dl></div>
  <div class="panel"><h3>Next step</h3><p class="muted" style="font-size:13.5px">Run the use cases to turn each outlook into a measured result: the capability report then shows what the AI actually did, and the gaps tab counts the use cases each gap blocked.</p></div></div>
  ${D.scope?`<div class="panel"><h3>Research by business area</h3><div class="tbl"><table class="num"><thead><tr><th>Area</th><th>Research</th><th>Use cases</th></tr></thead><tbody>${D.scope.areas.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.research==='frozen'?'frozen':x.research==='empty'?'not researched':x.research)}</td><td>${x.use_cases}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}
const RENDER = {caps:capsTab,vendor:()=>D.reference?vendorTab():'',summary,usecases:useCases,gaps:gapsTab,areas:areasTab,friction:frictionTab,fix:fixTab,personas:()=>D.analysis?aPersonas():personasTab(),driver:driverTab,quality:qualityTab,failed:failedTab,run:runTab};
let current = 'summary', detailUc = null;
function render(){
  app.innerHTML = header() + tabs() + `<main class="wrap page">${current==='summary'?UNVBANNER()+scopeBanner():''}<div class="tab" role="tabpanel" id="p-${current}" aria-labelledby="t-${current}">${current==='usecases'&&detailUc?ucDetail(detailUc):RENDER[current]()}</div>`
    + `<footer>${D.analysis?`<span>connector-qa ${esc(D.run.skill_version||'')} · analysis · built from the capability list and the catalog, nothing run</span><span>${esc(D.connector)} · ${esc(D.run.date)}</span>`:`<span>connector-qa ${esc(D.run.skill_version||'')} · run <span class="mono">${esc(D.run.id)}</span> · built from the results store</span><span>${esc(D.connector)} · agent used: ${esc(D.run.model)} · ${esc(D.run.date)}</span>`}</footer></main>`;
  app.querySelectorAll('[role="tab"]').forEach(b=>b.setAttribute('aria-selected',String(b.id==='t-'+current)));
}
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.getAttribute('role')==='tab'){ current = t.id.slice(2); detailUc = null; areaOpen = null; try{localStorage.setItem('cap-tab',current)}catch(_){} render(); return; }
  if(t.dataset.go){ current = t.dataset.go; render(); return; }
  if(t.dataset.f){ ucFilter = t.dataset.f; render(); return; }
  if(t.dataset.af){ aFilter = t.dataset.af; render(); return; }
  if(t.dataset.kf){ kStatus = t.dataset.kf; render(); return; }
  if(t.dataset.vf){ vFilter = t.dataset.vf; render(); return; }
  if(t.dataset.gv){ gVendorOnly = t.dataset.gv==='1'; render(); return; }
  if(t.dataset.fq){ fqOwner = t.dataset.fq; fqClass = ''; render(); return; }
  if(t.dataset.fqt){ const k = t.dataset.fqt; fqOpen.has(k) ? fqOpen.delete(k) : fqOpen.add(k); render(); return; }
  if(t.dataset.uc){ current = 'usecases'; detailUc = t.dataset.uc; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.back){ detailUc = null; render(); return; }
  if(t.dataset.area){ areaOpen = t.dataset.area; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.areaback){ areaOpen = null; render(); return; }
});
app.addEventListener('change', e => { if(e.target.id==='area-filter'){ ucArea = e.target.value; render(); } if(e.target.id==='fq-class'){ fqClass = e.target.value; render(); } if(e.target.id==='a-area-filter'){ aArea = e.target.value; render(); } if(e.target.id==='a-persona-filter'){ aPersona = e.target.value; render(); } if(e.target.id==='persona-filter'){ ucPersona = e.target.value; render(); } if(e.target.id==='v-area-filter'){ vArea = e.target.value; render(); }
  if(e.target.id==='uc-sort'){ ucSort = e.target.value; render(); } if(e.target.id==='uc-ev'){ ucEv = e.target.value; render(); }
  if(e.target.id==='a-sort'){ aSort = e.target.value; render(); } if(e.target.id==='a-ev'){ aEv = e.target.value; render(); }
  if(e.target.id==='k-area'){ kArea = e.target.value; render(); } });
/* the capability search re-renders as you type, and render() rebuilds the whole panel, so put the
 * caret back where it was or the box loses focus after the first keystroke */
app.addEventListener('input', e => { if(e.target.id!=='k-q') return;
  kQuery = e.target.value; render();
  const box = document.getElementById('k-q'); if(box){ box.focus(); try{ box.setSelectionRange(box.value.length, box.value.length); }catch(_){} } });
try{ const s = localStorage.getItem('cap-tab'); if(s && RENDER[s] && TABS.some(x=>x[0]===s)) current = s; }catch(_){}
if (D) render(); else app.innerHTML = '<p>This template has not been filled — run scripts/build-capability-report.mjs.</p>';
</script>
</body></html>
